<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDOT – Parcours d’apprentissage ESORSEM</title>
<meta name="theme-color" content="#1E2227">

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
<style>
:root{--rouge:#B3121F;--rouge-f:#7E0C16;--rouge-c:#F7E4E5;--argent:#8B9199;--argent-c:#E6E8EB;--encre:#1E2227;--gris:#5A6068;--papier:#FAFAF8;--blanc:#fff;--vert:#2E7D4F;--vert-c:#E3F2E8;--ambre:#A86B00;--ambre-c:#FFF4DC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papier);color:var(--encre);font:15px/1.5 "Segoe UI",Calibri,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0 .5em}
h2{font-size:1.5em;color:var(--rouge-f)}h3{font-size:1.1em;margin-top:1.2em}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:linear-gradient(90deg,var(--encre),#2C3138);color:#fff;border-bottom:4px solid var(--rouge)}
header img{height:64px}
header .t1{font-family:Georgia,serif;font-size:1.35em;letter-spacing:.02em}
header .t2{font-size:.85em;color:var(--argent-c);opacity:.85}
header .prog{margin-left:auto;text-align:right;font-size:.85em;min-width:160px}
.bar{height:8px;background:#444b54;border-radius:4px;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--rouge);width:0}
.wrap{display:flex;min-height:calc(100vh - 88px)}
nav{width:290px;flex-shrink:0;background:var(--blanc);border-right:1px solid var(--argent-c);padding:12px 0;overflow-y:auto}
nav .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);padding:12px 18px 4px;font-weight:600}
nav a{display:flex;align-items:center;gap:8px;padding:7px 18px;color:var(--encre);text-decoration:none;font-size:.92em;border-left:3px solid transparent}
nav a:hover{background:var(--argent-c)}
nav a.on{background:var(--rouge-c);border-left-color:var(--rouge);font-weight:600}
nav a.lock{color:#a8adb3;cursor:not-allowed}
nav .st{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:inline-grid;place-items:center;font-size:11px;border:1.5px solid var(--argent)}
nav .st.ok{background:var(--vert);border-color:var(--vert);color:#fff}
nav .st.en{border-color:var(--rouge);color:var(--rouge)}
nav .reu{font-style:italic}
main{flex:1;padding:22px 34px 60px;max-width:1100px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--argent-c);margin:14px 0 18px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 16px;font:inherit;cursor:pointer;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--rouge-f);border-bottom-color:var(--rouge);font-weight:600}
.vid{background:var(--blanc);border:1px solid var(--argent-c);border-left:4px solid var(--encre);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0}
.vid h3{margin:0 0 8px;font-size:1em}.vid .d{font-weight:400;color:var(--gris);font-size:.85em}
.vid video{width:100%;max-width:720px;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
.vid .ko{display:none;color:var(--ambre);font-size:.88em;margin-top:6px}.vid.err .ko{display:block}.vid.err video{display:none}
.vid+.vid{margin-top:8px}
@media print{.vid{display:none}}
.card{background:var(--blanc);border:1px solid var(--argent-c);border-radius:8px;padding:16px 20px;margin:12px 0}
.q{font-weight:700;color:var(--rouge-f)}
.ref{font-size:.8em;color:var(--gris);font-style:italic}
.but{border-left:4px solid var(--rouge);background:var(--rouge-c);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.vig{border-left:4px solid var(--ambre);background:var(--ambre-c);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.vig b{color:var(--ambre)}
ul.c{padding-left:20px;margin:.3em 0}ul.c li{margin:.2em 0}
table{border-collapse:collapse;width:100%;margin:6px 0}
th,td{border:1px solid var(--argent-c);padding:6px 8px;vertical-align:top;text-align:left;font-size:.92em}
th{background:var(--encre);color:#fff;font-weight:600}
td input,td select,td textarea{width:100%;border:1px solid transparent;background:transparent;font:inherit;padding:3px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--argent);background:#fff;outline:none}
.fld{margin:10px 0}.fld label{display:block;font-weight:600;font-size:.92em;margin-bottom:3px}
.fld .h{font-size:.82em;color:var(--gris);margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 9px;border:1px solid var(--argent);border-radius:5px;font:inherit;background:#fff}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--rouge);color:#fff;border:none;padding:8px 14px;border-radius:5px;font:inherit;cursor:pointer;font-size:.9em}
.btn:hover{background:var(--rouge-f)}.btn.s{background:var(--argent-c);color:var(--encre)}.btn.s:hover{background:#d3d6da}
.btn.x{background:none;color:var(--gris);padding:2px 6px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* frise MEDOT */
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.ph{background:#fff;border:1px solid var(--argent-c);border-radius:8px;overflow:hidden}
.ph h4{margin:0;padding:8px 12px;background:var(--encre);color:#fff;font-family:Georgia,serif;font-size:.95em}
.ph .s{display:block;padding:6px 12px;border-top:1px solid var(--argent-c);font-size:.88em;cursor:pointer;color:var(--encre);text-decoration:none}
.ph .s:hover{background:var(--rouge-c)}
.ph .r{background:var(--rouge);color:#fff;font-weight:600}.ph .r:hover{background:var(--rouge-f)}
.ph .lk{color:#a8adb3;cursor:default}.ph .lk:hover{background:none}
/* quiz */
.qz{margin:14px 0}.qz .qq{font-weight:600;margin-bottom:6px}
.qz .o{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--argent);border-radius:5px;padding:7px 10px;margin:4px 0;font:inherit;cursor:pointer}
.qz .o:hover:not(:disabled){background:var(--argent-c)}
.qz .o.good{background:var(--vert-c);border-color:var(--vert)}.qz .o.bad{background:var(--rouge-c);border-color:var(--rouge)}
.qz .o:disabled{cursor:default;color:var(--encre);opacity:1}
.qz .ex{font-size:.9em;padding:8px 10px;background:var(--argent-c);border-radius:5px;margin-top:4px}
.score{font-size:1.1em;font-weight:700;padding:12px;border-radius:6px;text-align:center}
.score.ok{background:var(--vert-c);color:var(--vert)}.score.ko{background:var(--ambre-c);color:var(--ambre)}
/* flashcards */
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fcd{background:#fff;border:1px solid var(--argent-c);border-top:3px solid var(--rouge);border-radius:6px;padding:12px;min-height:110px;cursor:pointer;font-size:.9em}
.fcd .tt{font-family:Georgia,serif;font-weight:700;font-size:1.05em;color:var(--rouge-f)}
.fcd .df{display:none;margin-top:6px}.fcd.flip .df{display:block}.fcd.flip .hint{display:none}
.hint{color:var(--gris);font-size:.8em;margin-top:8px}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:4px}
.tag{display:inline-block;font-size:.75em;padding:1px 7px;border-radius:10px;background:var(--argent-c);color:var(--gris);margin-left:6px}
.ok-msg{color:var(--vert);font-size:.85em}.warn{color:var(--ambre);font-size:.85em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}.modal .card{max-width:760px;width:92%;max-height:85vh;overflow:auto}
footer{font-size:.78em;color:var(--gris);padding:10px 34px;border-top:1px solid var(--argent-c);background:#fff}
.next{margin-top:24px;display:flex;justify-content:space-between}
@media(max-width:820px){.wrap{flex-direction:column}nav{width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--argent-c)}main{padding:16px}.cycle{grid-template-columns:1fr}header img{height:44px}header .prog{display:none}}

.menu{display:none;background:none;border:1px solid #6b7280;color:#fff;font-size:1.4em;border-radius:6px;padding:4px 12px;margin-left:auto;cursor:pointer}
.demo-sw{display:block;margin-top:8px;cursor:pointer;color:#fff}
.demo-banner{background:var(--ambre-c);border-bottom:2px solid var(--ambre);padding:10px 20px;font-size:.9em}
.demo-banner .btn{margin-left:8px}
.cycle-svg svg{width:100%;height:auto;display:block}
.cycle-svg .cl{font:600 13px Georgia,serif;fill:#7E0C16}
.cycle-svg .nt{font:600 12px "Segoe UI",Arial,sans-serif}
.cycle-svg .nq{font:italic 11.5px "Segoe UI",Arial,sans-serif;fill:#5A6068}
.cycle-svg .nd{cursor:pointer}
.cycle-svg .nd.soon{opacity:.45;cursor:default}
.cycle-svg .nd:focus{outline:none}
.scores .sc{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:10px;align-items:center;padding:4px 0}
.scores a{color:var(--encre);font-size:.9em}
.sb{position:relative;height:14px;background:var(--argent-c);border-radius:7px}
.sb i{display:block;height:100%;border-radius:7px;background:var(--ambre)}.sb i.ok{background:var(--vert)}
.sb .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--encre)}
.hbars .hb{display:grid;grid-template-columns:190px 1fr 36px;gap:10px;align-items:center;padding:3px 0;font-size:.9em}
.hbars .hb div{background:var(--argent-c);height:16px;border-radius:4px}.hbars i{display:block;height:100%;border-radius:4px;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82em;margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
ol.tl{list-style:none;padding:0 0 0 18px;margin:8px 0;border-left:3px solid var(--argent-c)}
ol.tl li{position:relative;padding:6px 0 6px 14px;display:flex;gap:14px;flex-wrap:wrap}
ol.tl li::before{content:"";position:absolute;left:-27px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px var(--c)}
ol.tl .g{font-weight:700;min-width:110px;color:var(--rouge-f);font-variant-numeric:tabular-nums}
ol.tl .e{flex:1;min-width:180px}
.sync{display:grid;gap:4px;overflow-x:auto;font-size:.86em}
.sync .lb{font-weight:700;align-self:center;font-size:.85em;color:var(--gris)}
.sync .lb.ami{color:#1F5F99}.sync .lb.eni{color:var(--rouge-f)}
.sync .tm{font-weight:700;text-align:center;background:var(--encre);color:#fff;border-radius:4px;padding:4px}
.sync .blk{border-radius:5px;padding:6px 8px}
.sync .blk.ami{background:#E3EDF7;border-left:4px solid #1F5F99}
.sync .blk.eni{background:var(--rouge-c);border-left:4px solid var(--rouge)}
.sync .mid{text-align:center;padding:4px;border-radius:5px;background:#fff;border:1px dashed var(--argent)}
.sync .mid.op{border:1.5px solid var(--vert);background:var(--vert-c)}.sync .mid.op b{color:var(--vert)}
.sync .mid.ri{border:1.5px solid var(--ambre);background:var(--ambre-c)}.sync .mid.ri b{color:var(--ambre)}
.sync .rf{font-size:.85em;color:var(--gris)}
details summary{cursor:pointer;color:var(--rouge-f);margin-top:10px}
.cycle{display:none}
@media(max-width:820px){
 .menu{display:block}
 .cycle-svg{display:none}.cycle{display:grid}
 nav{display:none;position:sticky;top:0;z-index:5;max-height:75vh;box-shadow:0 6px 16px rgba(0,0,0,.15)}
 nav.open{display:block}
 nav a{padding:12px 18px;min-height:44px}
 header{flex-wrap:wrap}
 .demo-sw{display:inline-block;margin:0 0 0 10px}
 .scores .sc{grid-template-columns:1fr 60px;}.scores .sb{grid-column:1/-1;grid-row:2}
 .hbars .hb{grid-template-columns:130px 1fr 30px}
 main table{display:block;overflow-x:auto}
 .tabs button{flex:1;padding:12px 6px}
 .qz .o{padding:11px 12px}
}

/* ---- accessibilité / forme (audit) ---- */
:root{--ambre:#8A5700;--vert:#256B42;--verrou:#6B7179}
h1.t1{margin:0;font-weight:normal;font-size:1.35em}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:20;background:#fff;padding:8px;color:var(--encre)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card>h3:first-child{margin-top:0}
:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
header :focus-visible{outline-color:#fff}.btn:focus-visible{outline-color:var(--encre)}
main:focus{outline:none}
nav a.lock,.ph .lk{color:var(--verrou)}nav .st{border-color:var(--gris)}
td input,td select,td textarea{border:1px solid var(--argent);background:#fff;border-radius:4px;padding:5px 6px;min-height:36px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--rouge);outline:2px solid var(--rouge);outline-offset:1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.ph .s{width:100%;text-align:left;border:none;border-top:1px solid var(--argent-c);background:none;font:inherit}
.ph .s.r{background:var(--rouge);color:#fff}.ph .s.r:hover{background:var(--rouge-f)}.ph .s.r.lk{background:var(--argent-c);color:var(--verrou)}
.fcd{text-align:left;font:inherit;color:inherit;width:100%;display:block}.fcd .tt,.fcd .hint{display:block}
.btn.dk{background:var(--encre);color:#fff}.btn.dk:hover{background:#000}
nav .grp{font-size:.8em}.tag{font-size:.8em}.hint{font-size:.85em}footer{font-size:.85em}.ref{font-size:.85em}
header{box-shadow:0 2px 0 var(--argent)}
.ph h4{background:linear-gradient(90deg,var(--rouge-f),var(--rouge))}
@media(min-width:821px){nav{position:sticky;top:0;align-self:flex-start;max-height:100vh}}
@media(hover:none){nav a:hover,.ph .s:hover,.qz .o:hover:not(:disabled),.btn.s:hover{background:inherit}}
@media(pointer:coarse){nav a,.ph .s,.btn,.qz .o,.tabs button{min-height:44px}.btn.x{min-width:44px;min-height:44px;font-size:1.1em}input[type=checkbox]{width:22px;height:22px}.chk label{padding:8px 0;min-height:44px;align-items:center}td select,td input{min-height:44px}}
@media(max-width:820px){
 nav{display:block!important;position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);max-height:none;z-index:8;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px #0003}
 nav.open{transform:none}
 body.navopen::after{content:"";position:fixed;inset:0;background:#0006;z-index:7}
 header .prog{display:block!important;min-width:0;font-size:.75em;margin-left:0;order:3;width:100%;text-align:left}
 header .t2{display:none}
 main table{display:table}
}
@media(max-width:600px){
 .tw thead{display:none}
 .tw tr{display:block;border:1px solid var(--argent-c);border-radius:6px;margin:8px 0;padding:6px;background:#fff}
 .tw td{display:block;border:none;padding:4px 2px}
 .tw td[data-l]::before{content:attr(data-l);display:block;font-size:.8em;font-weight:600;color:var(--gris)}
 .next{flex-direction:column}.next .btn{width:100%}
 .tabs{flex-wrap:nowrap}.tabs button{padding:10px 4px;font-size:.88em}
}
@media(max-width:820px){header{padding:8px 12px;gap:10px}header img{height:40px}h1.t1{font-size:1.05em}
 header .prog{display:flex!important;align-items:center;gap:10px;flex-wrap:wrap}header .prog .bar{flex:1;min-width:120px;margin:0}.demo-sw{margin:0!important}
 .demo-banner{padding:8px 12px}}
.demo-banner details{display:inline}.demo-banner summary{cursor:pointer;display:inline}
.sync-m{display:none}
@media(max-width:600px){.sync{display:none}.sync-m{display:block}.sync-m .sm{display:grid;gap:4px;margin-bottom:12px;font-size:.9em}.sync-m small{display:block;font-weight:700;font-size:.75em;text-transform:uppercase;color:var(--gris)}.sync-m .tm{font-weight:700;background:var(--encre);color:#fff;border-radius:4px;padding:4px 8px}.sync-m .blk{border-radius:5px;padding:6px 8px}.sync-m .blk.ami{background:#E3EDF7;border-left:4px solid #1F5F99}.sync-m .blk.eni{background:var(--rouge-c);border-left:4px solid var(--rouge)}.sync-m .mid{padding:6px;border-radius:5px;border:1px dashed var(--argent)}.sync-m .mid.op{border:1.5px solid var(--vert);background:var(--vert-c)}.sync-m .mid.ri{border:1.5px solid var(--ambre);background:var(--ambre-c)}}
@media print{nav,header .prog,.tabs,.btn,footer{display:none}}
/* ---- livraison 2 : phase 2, cas, examen, fiche, recherche ---- */
.gantt{font-size:.86em}
.gantt .gr{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr);gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--argent-c)}
.gantt .gr.ax{border-top:none;padding:0}
.gantt .lbl{line-height:1.3;min-width:0;overflow-wrap:anywhere}.gantt .lbl small{display:block;color:var(--gris)}
.gantt .trk{position:relative;height:24px;margin-right:10px;background:#F3F4F6;border-radius:4px}
.gantt .trk .tk{position:absolute;top:0;bottom:0;width:1px;background:#D5D8DC}
.gantt .trk .bar{position:absolute;top:4px;height:16px;border-radius:4px;min-width:6px;box-shadow:inset 0 0 0 1px #0002}
.gantt .trk .pd{position:absolute;top:-1px;font-size:19px;line-height:1;color:#E0A800;transform:translateX(-50%);text-shadow:0 0 1px #000,0 0 2px #000}
.gantt .trk .na{position:absolute;left:8px;top:3px;font-size:.85em;color:var(--gris);font-style:italic}
.gantt .ticks{position:relative;height:18px;margin-right:10px;font-size:.8em;color:var(--gris);font-variant-numeric:tabular-nums}
.gantt .ticks span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.gantt .ticks span.f{transform:none}.gantt .ticks span.l{transform:translateX(-100%)}
.pdk{color:#B07F00;font-weight:700}
@media(max-width:600px){.gantt .gr{grid-template-columns:minmax(0,1fr)}.gantt .gr.ax .lbl{display:none}}
.cmpg{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:4px 6px;align-items:center;font-size:.9em}
.cmpg .hd{font-weight:700;text-align:center;font-size:.85em;color:var(--gris)}.cmpg .hd:first-child{text-align:left}
.cmpg .v{text-align:center;border-radius:4px;padding:4px 2px;font-weight:700}
.v.p{background:var(--vert-c);color:var(--vert)}.v.z{background:var(--argent-c);color:var(--gris)}.v.m{background:var(--rouge-c);color:var(--rouge-f)}
.tot{display:grid;grid-template-columns:44px minmax(0,1fr) 48px;gap:8px;align-items:center;margin:6px 0}
.tot .trk{position:relative;height:18px;background:var(--argent-c);border-radius:4px}
.tot .trk::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--encre)}
.tot .trk i{position:absolute;top:0;bottom:0;border-radius:4px}
.mame{display:grid;gap:6px;font-size:.9em}
.mame .hd{font-weight:700;text-align:center;align-self:end;color:var(--gris)}
.mame .rh{font-weight:700;align-self:center}
.mame .mc{border-radius:6px;padding:8px;min-height:64px;border:1.5px solid var(--argent);background:#F3F4F6;min-width:0;overflow-wrap:anywhere}
.mame .mc.g{background:var(--vert-c);border-color:var(--vert)}.mame .mc.a{background:var(--ambre-c);border-color:var(--ambre)}.mame .mc.r{background:var(--rouge-c);border-color:var(--rouge)}
.mame .mc small{display:block;color:var(--gris)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #0003}
.cor{border:2px solid var(--vert);border-radius:8px;padding:12px 16px;margin:14px 0;background:#F6FAF7}
.cor h3{color:var(--vert);margin-top:0}.cor h4{margin:14px 0 4px;font-size:1em}
.cor .com{border-left:4px solid var(--vert);background:#fff;padding:8px 12px;margin:8px 0}
.cor table{background:#fff}.cor p{margin:.4em 0}

<script>
/*__demo.js__*/
/* ============ DONNÉES ============ */
const FO=["Interarmes","Commandement","Contact","Renseignement","Appui (génie, feux, appui électronique)","Effets champs immatériels","Appui à l’engagement","Soutien"];
const TCIDR_TYPES=["Tâche","Contrainte","Impératif","Demande","Besoin en renseignement"];

const M=[
{id:"accueil",grp:"Démarrer",title:"Accueil",kind:"home"},
{id:"vocab",grp:"Démarrer",title:"Vocabulaire de la MEDOT",
 intro:"Avant d’entrer dans la méthode, il faut parler la même langue que l’état-major. Retourne chaque carte pour vérifier la définition, puis passe au test.",
 cards:[
 ["Fait (facteur)","Ce qui est reconnu comme certain, incontestable (caractère objectif)."],
 ["Déduction","Raisonnement partant de l’observation d’un fait."],
 ["Conclusion tactique","Conséquence ou jugement déduit d’une déduction (caractère subjectif). Prend la forme de tâches, contraintes, impératifs, demandes, besoins en renseignement ou amendements à la frise chronologique."],
 ["Comparaison","Les modes d’action amis (MA) sont comparés entre eux selon des critères (pondérés ou non) fixés ou validés par l’autorité, pour en tirer avantages et inconvénients relatifs."],
 ["Confrontation","Opposer chaque MA à chaque mode d’action ennemi (ME), par phases ou temps successifs, en vérifiant que chaque MA permet de faire face à tous les ME envisagés ; en déduire risques, opportunités et aménagements. Les ME sont les références : ils ne sont pas amendés en fonction des MA ; ce sont les MA qui le sont si nécessaire."],
 ["Contrainte","Prescription ou donnée objective imposée, entravant la liberté d’action du chef et entraînant des mesures à prendre."],
 ["Impératif","Mesure à prendre ou condition à réaliser, indispensable pour la réussite de la manœuvre."],
 ["Avantage / inconvénient","Décrit à l’indicatif : aspect positif / négatif d’un MA par rapport à un autre MA, au regard des critères interarmes et des critères propres aux fonctions opérationnelles."],
 ["Mode tactique","Action générique caractérisant un type d’action selon les effets à produire : mode offensif, défensif, sécurisation, assistance."],
 ["Mode d’action générique (MAG)","Façon d’agir dominante issue des modes tactiques, aux niveaux de commandement 1 à 3, permettant de choisir les moyens et de combiner leurs actions pour produire un effet sur l’ennemi ou le milieu. Aux niveaux subordonnés, la manœuvre est exécutée : on reçoit une mission."],
 ["Mission","Expression claire et concise de l’action à accomplir et du but poursuivi."],
 ["Tâche","Ce qui doit être accompli pour que la mission soit exécutée : tout (rarement) ou partie (le plus souvent) de l’action à entreprendre. Elle implique l’emploi de moyens et de procédés spécifiques (déplacement, franchissement, débouché, recueil…). Les tâches peuvent être simultanées ou successives."],
 ["Tâche spécifiée / induite","Spécifiée : explicitement notifiée dans les ordres du supérieur (directive, OPLAN, PS, OPORD, FRAGO). Induite : implicite, déduite de l’analyse de la mission reçue."],
 ["Risque / opportunité","Conséquence potentiellement défavorable / favorable pouvant résulter de la confrontation entre manœuvre amie et manœuvre adverse."],
 ["Manœuvre","Emploi des forces combinant mouvement, feux et effets dans les champs immatériels pour se mettre en position favorable et remplir la mission. Trois étapes : préparation, réalisation et exploitation de l’effet majeur (elles ne se confondent pas toujours avec les phases du MA)."],
 ["Idée de manœuvre","Expression nette et concise de la façon dont le chef entend réaliser sa mission : comment, quand et par où il veut agir, sans détailler la répartition des moyens. Elle englobe la totalité de la mission."],
 ["Mode d’action","Succession d’actes combinant attitudes et moyens dans l’espace et le temps pour réaliser les tâches. Rapporté au terrain, assez général pour rester peu nombreux, assez précis pour être différencié."],
 ["But à atteindre","Synthèse de la contribution de notre action à la manœuvre du supérieur ; l’esprit de la mission (« Pourquoi ? »). Commence par « En vue de » ou « Afin de », tourné vers le niveau supérieur."],
 ["Effet majeur (V.2022)","Résulte de l’action décisive, directe ou indirecte, contre un adversaire, dans un cadre espace-temps donné, dont l’exploitation permet de remplir la mission."],
 ["Centre de gravité tactique","Capacité spécifique et localisée (une unité ou un groupe de forces) qui conditionne la liberté d’action du système dans l’aptitude à atteindre ses objectifs ; la « capacité clé ». Son étude identifie les vulnérabilités ennemies à cibler et amies à protéger. Il doit être à la portée de nos moyens. Dans la méthode française : simple outil, sans lien avec l’effet majeur."],
 ["Présupposition","Hypothèse de travail sur un paramètre de l’étude (jamais sur l’ennemi) : nécessaire, réalisable et vérifiée avant l’action."],["Action décisive","Action directe ou indirecte contre l’adversaire, dans un cadre espace-temps donné, qui permet de prendre un avantage déterminant dans le cadre de la mission : elle valorise une opportunité significative ou s’oppose à un risque significatif."],["Moment clé","Cadre temporel d’obtention de l’effet majeur, c’est-à-dire la fin de l’action décisive (et non son début). Ce n’est pas le moment de bascule du rapport de force."],["Zone clé","Lieu de l’action décisive retenue. Ébauchée à l’analyse du terrain ami, elle devient définitive à la confrontation des séquences ennemies-amie."],["Intention","But à atteindre accompagné de l’effet majeur : contribution du chef à la manœuvre du supérieur et manière dont il compte remplir sa mission."],["Séquence","Liste chronologique des tâches interarmes que doit réaliser une unité dans le cadre de sa mission (ou MAG). Ce n’est pas un mode d’action : elle en devient un en phase 2, quand les manœuvres de toutes les fonctions sont rapportées au terrain et aux délais."],["Fréquence","Capacité d’une unité à réaliser des missions successives selon le cycle engagement – attrition – régénération – réengagement. Obligatoirement utilisée lors de la conception des modes d’action."],["Besoins en informations prioritaires du chef (CCIR)","Se déclinent en PIR (besoins prioritaires en renseignement), FFIR (informations sur les forces amies), EEFI (informations à protéger) et HNIR (informations sur la nation hôte). Les PIR sont validés en fonction du MA retenu en réunion de décision."]],
 vig:["La définition de l’effet majeur a changé en 2022 : l’ancienne (« condition dont la réalisation garantit le succès de la mission ») est caduque.",
      "Effet majeur et centre de gravité ne sont pas liés dans la méthode française : le centre de gravité est un outil, l’effet majeur est au cœur de la réflexion.",
      "Pas de présupposition sur l’ennemi : ses modes d’action ne peuvent être que supposés, jamais vérifiés avant l’action.",
      "C’est l’articulation entre but à atteindre et effet majeur qui permet la subsidiarité : le but à atteindre replace notre action dans la manœuvre du chef, l’effet majeur permet aux subordonnés de placer leur action dans la manœuvre d’ensemble."],
 apply:[{t:"note",x:"Entraîne-toi à la chaîne de raisonnement : pour chaque fait relevé dans un ordre ou une situation, écris la déduction puis la conclusion tactique (sous forme de T, C, I, D ou R)."},
        {t:"table",id:"fdc",cols:[{k:"f",l:"Fait",ph:"Ex. : le pont de Morlac est le seul franchissement pour les véhicules lourds"},{k:"d",l:"Déduction",ph:"Ex. : sa perte rendrait notre recueil impossible"},{k:"c",l:"Conclusion tactique",ph:"Ex. : faire garder le pont par la section génie jusqu’à la fin du recueil"},{k:"y",l:"Type",o:TCIDR_TYPES}]}],
 quiz:[
 {q:"Un fait (facteur) est…",o:["ce qui est reconnu comme certain, incontestable","une hypothèse de travail sur un paramètre de l’étude","un jugement déduit d’une déduction","une conséquence potentiellement défavorable"],a:0,e:"Le fait a un caractère objectif. La conclusion, elle, est subjective."},
 {q:"Sous quelles formes une conclusion tactique s’exprime-t-elle ?",o:["Tâches, contraintes, impératifs, demandes, besoins en renseignement ou amendements à la frise","Faits, déductions, hypothèses, présuppositions ou ébauches de modes d’action amis","Avantages, inconvénients, risques, opportunités ou points de décision à surveiller en conduite","Points clés, zones clés, moments clés, actions décisives ou rapports de force en 1re approche"],a:0,e:"C’est le TCIDR (tâches, contraintes, impératifs, demandes, besoins en renseignement), complété par la frise chronologique. Faits et déductions précèdent la conclusion ; avantages, risques et points clés sont des produits d’étapes précises."},
 {q:"Une contrainte est…",o:["une donnée imposée qui entrave la liberté d’action du chef","une mesure ou condition indispensable à la réussite de la manœuvre","une hypothèse de travail nécessaire, réalisable et vérifiée avant l’action","un besoin d’information adressé à l’échelon supérieur sous forme de DI"],a:0,
  e:"« Mesure ou condition indispensable » définit l’impératif ; « hypothèse de travail… vérifiée avant l’action », la présupposition ; un besoin adressé au supérieur relève de la demande. Contrainte et impératif sont deux formes différentes de conclusion tactique."},
 {q:"La mission, c’est…",o:["l’action à accomplir et le but poursuivi, exprimés clairement","la façon dont le chef entend agir : comment, quand et par où","la seule liste des tâches spécifiées notifiées par le supérieur","l’action décisive dont l’exploitation permet de remplir l’ordre"],a:0,
  e:"« Expression claire et concise de l’action à accomplir et du but poursuivi ». « Comment, quand et par où » définit l’idée de manœuvre ; « l’action décisive… dont l’exploitation » renvoie à l’effet majeur. Les tâches ne sont qu’une partie de l’action à entreprendre."},
 {q:"Le but à atteindre…",o:["répond à « Pourquoi ? », commence par « En vue de » ou « Afin de », tourné vers le niveau supérieur", "répond à « Comment ? », décrit l’action décisive contre l’adversaire dans un cadre espace-temps donné", "répond à « Quoi ? », reprend les tâches spécifiées et induites notifiées par l’échelon supérieur", "répond à « Pourquoi ? », commence par « En vue de », tourné vers nos subordonnés et leurs missions"],a:0,e:"C’est l’esprit de la mission, qui replace notre action dans la manœuvre du supérieur."},
 {q:"Quelle est la définition en vigueur de l’effet majeur ?",o:["Il résulte de l’action décisive, directe ou indirecte, contre un adversaire, dans un cadre espace-temps donné, dont l’exploitation permet de remplir la mission", "Condition dont la réalisation garantit le succès de la mission ; il exprime les effets à obtenir sur l’adversaire ou le milieu en un temps et un lieu donnés", "Capacité spécifique et localisée qui conditionne la liberté d’action de l’adversaire dans son aptitude à atteindre ses objectifs", "Expression nette et concise de la façon dont le chef entend réaliser sa mission : comment, quand et par où il veut agir"],a:0,e:"Définition PFT 5.1 V.2022. La deuxième proposition est l’ancienne définition du MFT 5.2.1, caduque."},
 {q:"Dans la méthode française, le centre de gravité…",o:["est un simple outil d’analyse, sans lien avec l’effet majeur","est l’élément dont on déduit l’effet majeur, validé en réunion de synthèse","est le cœur de la réflexion tactique, comme dans le COPD de l’OTAN","n’est étudié que chez l’ennemi, pour désigner la cible de l’effet majeur"],a:0,e:"Dans la MEDOT, le centre de gravité est un outil sans lien avec l’effet majeur, qui est, lui, au cœur de la réflexion. Il est en revanche essentiel dans la méthode opérative de l’OTAN (COPD). Son étude porte sur les vulnérabilités ennemies à cibler et amies à protéger."},
 {q:"Peut-on émettre une présupposition sur l’ennemi ?",o:["Non","Oui, si elle est vérifiée avant l’action","Oui, seulement au niveau 4","Oui, en phase préalable uniquement"],a:0,g:"presup-eni",e:"Une présupposition doit être nécessaire, réalisable et vérifiée avant l’action : impossible pour l’ennemi."},
 {q:"Une tâche induite est…",o:["implicite, déduite de l’analyse de la mission reçue","notifiée explicitement dans un ordre du supérieur (OPORD, FRAGO)","une tâche que le chef confie à ses subordonnés dans le plan simplifié","une contrainte imposée par le supérieur, qui limite notre liberté d’action"],a:0,e:"Les tâches spécifiées sont explicitement notifiées dans les ordres du supérieur ; les induites sont implicites et déduites de l’analyse de la mission."},
 {q:"Quelles sont les trois étapes doctrinales de la manœuvre française ?",o:["Préparation, réalisation et exploitation de l’effet majeur","Analyse, synthèse et décision sur le mode d’action ami","Mouvement, feux et effets dans les champs immatériels","Orientation, synthèse et décision, conclues chacune par une réunion"],a:0,e:"Ces étapes ne se confondent pas toujours avec les phases (temps) du mode d’action. Orientation, synthèse et décision sont les réunions de la MEDOT ; mouvement, feux et effets sont ce que combine la manœuvre."},
 {q:"Le mode d’action générique (MAG) est employé…",o:["aux niveaux 1 à 3 ; aux niveaux subordonnés, on reçoit une mission","aux niveaux 4 et 5 seulement, quand le supérieur ne donne pas de mission","en phase 2, pour désigner le mode d’action retenu par le chef","par l’ennemi, pour décrire la façon d’agir dominante de ses ME"],a:0,
  e:"Le MAG est une façon d’agir dominante issue des modes tactiques, aux niveaux 1 à 3. Aux niveaux subordonnés, la manœuvre est exécutée : on reçoit une mission. D’où la formule « par rapport à la mission (ou MAG) »."},
 {q:"Dans la méthode française, qu’est-ce qui permet la subsidiarité de chaque niveau tactique ?",o:["L’articulation entre le but à atteindre et l’effet majeur", "L’identification des centres de gravité ami et ennemi", "La comparaison des MA selon les critères du chef", "La confrontation des séquences ennemies à la séquence amie"],a:0,e:"Le but à atteindre replace notre action dans la manœuvre du chef ; l’effet majeur permet aux subordonnés de placer la leur."},
 {"q":"Le moment clé correspond…","o":["au cadre temporel d’obtention de l’effet majeur (fin de l’action décisive)","au GDH de début de l’action décisive","au moment de bascule du rapport de force","au GDH de franchissement de la ligne de débouché"],"a":0,"e":"Le moment clé est lié à l’obtention de l’effet majeur, pas au début de l’action décisive ni à la bascule du rapport de force"},
 {"q":"Une conclusion qui n’entre dans aucun type TCIDR-F est…","o":["encore une déduction : il faut pousser le raisonnement","une présupposition à lever en synthèse","un impératif implicite","un besoin en renseignement par défaut"],"a":0,"e":"Une conclusion non qualifiable n’est qu’au stade de la déduction et n’est pas utile à l’autorité"},
 {"q":"Que désigne la fréquence ?","o":["La capacité d’une unité à enchaîner des missions selon le cycle engagement-attrition-régénération-réengagement","Le rythme de diffusion des WINGO aux subordonnés","La périodicité des points de situation en conduite","Le nombre de réunions de la MEDOT"],"a":0,"e":"Notion obligatoirement utilisée lors de la conception des modes d’action"},
 {"q":"L’intention du chef, c’est…","o":["le but à atteindre accompagné de l’effet majeur","l’effet majeur accompagné de l’idée de manœuvre","la mission reformulée par le chef","le but à atteindre de l’échelon supérieur"],"a":0,"e":"L’intention précise la contribution à la manœuvre du supérieur (but à atteindre) et comment remplir la mission (effet majeur)"}
 ]},

{id:"prealable",grp:"Phase préalable",title:"Analyse du contexte d’engagement",
 but:"Présenter les délais disponibles pour la MEDOT et les conclusions tactiques de l’analyse du contexte d’engagement par rapport à la mission (ou MAG).",
 sections:[
 {h:"Domaines à étudier (niveaux 4 à 3)",l:["Style général de l’action : cadre (national, ONU, coalition, OTAN…), contexte (coercition, interposition, sécurisation…), style (offensif, défensif, 1er ou 2e échelon…)","Terrain / météo : style de terrain, gabarit de la zone d’opération, météo prévue","Ennemi : éléments d’un niveau supérieur et égal à l’ennemi de notre supérieur + autres parties prenantes (acteurs hostiles, populations…)","Ami : éléments d’un niveau supérieur et égal à notre supérieur + autres parties prenantes (neutres ou favorables, ONG, populations…)","Délais : saison, lever / coucher du soleil, durées jour / nuit, phase de la lune, dates critiques","Règles d’engagement : ouverture du feu, légitime défense…","Média : règles de comportement, éléments de langage, consignes","Champs immatériels : actions en cours, effets obtenus ou à espérer"]},
 {h:"Conclusions attendues",l:["Cadencement d’élaboration des ordres : production de nos ordres et succession des réunions (avec le supérieur et les subordonnés)","Conclusions sur l’étude des domaines (selon notre niveau) par rapport à la mission ou au MAG reçu","Conclusions de l’étude de la manœuvre du supérieur : mission, idée de manœuvre, évaluation de la situation","Conclusions de l’étude de la manœuvre de l’ennemi du supérieur : objectifs, délais, modes d’action","Cadre espace-temps de notre action : norme d’engagement et délais de notre mission","Qualification de notre liberté d’action (contrainte ou non) et conclusions pour valoriser ou compenser","Premières présuppositions et premiers TCIDR éventuels de toutes les fonctions opérationnelles (dont nos actions renseignement et ACIm en cours)","Début de la frise chronologique (obligatoire) avec les 1res tâches interarmes et les dates importantes du contexte"]},
 {h:"Règle du tiers-temps",p:"Un PC ne doit pas consacrer à la rédaction d’un ordre plus du tiers du temps disponible (délais de mouvement retranchés) entre la réception de l’ordre du niveau supérieur et le début de la conduite des opérations."},
 {h:"Orientation préalable",p:"Facultative, à la diligence du chef. Elle peut suivre les premiers WINGO reçus, avant même la réception formelle de la mission. Si elle n’a pas lieu (niveaux 4 et 3), ses conclusions sont présentées avec celles de l’analyse de la mission lors de la réunion d’orientation initiale. L’autorité y livre sa vision du contexte et oriente les analyses."},{"h":"Compléments","l":["Durée indicative d’élaboration d’un ordre initial (conçu avant le début de la bataille) : CA au moins 24 h, DIV 15 à 16 h, BIA 10 à 12 h, GTIA 7 à 8 h, SGTIA 4 à 5 h, section 2 h ; les sections conservent au moins 6 h pour exécuter les ordres. Une fois engagé, on dispose de délais beaucoup plus courts : concevoir plus vite, anticiper davantage, rédiger des ordres plus simples et plus courts.","Durée indicative des missions en haute intensité, modes offensif et défensif : mission BIA 18 à 36 h, mission GTIA 6 à 12 h (une par jour, deux si l’action est très dynamique), mission SGTIA 2 à 4 h ; MAG DIV jusqu’à 108 h (4,5 jours).","Une fois la bataille engagée, les délais sont beaucoup plus courts : MEDOT simplifiée, anticipation par le plan de manœuvre, ordres simples et courts.","Pendant la MEDOT d’un échelon, le subordonné mène une conception parallèle nourrie par les WINGO successifs ; après le mission brief, le supérieur met à jour son OPO pendant que le subordonné conduit sa propre MEDOT (back brief, puis rehearsal).","La phase préalable est toujours réalisée par toutes les fonctions opérationnelles et synthétisée par le bureau renseignement : c’est la 1re étape de la PREO."]}],
 vig:["La frise chronologique commence dès la phase préalable : elle est obligatoire.","Les conclusions sont tirées par rapport à la mission (ou MAG), pas dans l’absolu.","Les conclusions sont partagées avec les subordonnés et avec le supérieur ; l’échelon supérieur transmet ses propres conclusions aux subordonnés.","Il n’y a pas d’analyse du contexte durant la phase 1 : le contexte est étudié en phase préalable."],
 apply:[{t:"note",x:"Commence par le calculateur du tiers-temps : il fixe le temps dont tu disposes pour toute la MEDOT. Pour chaque domaine, relève les faits utiles puis tire une conclusion par rapport à ta mission, pas dans l’absolu. Qualifie ensuite ta liberté d’action et ouvre la frise (obligatoire) avec les premières tâches et les dates du contexte."},{t:"tiers"},
  {t:"table",id:"ctx",fixed:["Style général de l’action","Terrain / météo","Ennemi","Ami","Délais","Règles d’engagement","Média","Champs immatériels","Manœuvre du supérieur","Manœuvre de l’ennemi du supérieur"],cols:[{k:"d",l:"Domaine",ro:1},{k:"f",l:"Faits relevés"},{k:"c",l:"Conclusions par rapport à la mission"}]},
  {t:"fields",id:"ctxla",f:[{k:"la",l:"Liberté d’action par rapport au contexte",o:["","Non contrainte","Contrainte"]},{k:"vc",l:"Conclusions pour valoriser ou compenser",a:1},{k:"pp",l:"Présuppositions éventuelles",a:1,h:"Nécessaires, réalisables, vérifiées avant l’action – jamais sur l’ennemi."}]},
  {t:"tcidr"},{t:"frise"}],
 quiz:[
 {q:"Quels sont les objectifs de la phase préalable ?",o:["Présenter les délais disponibles et les conclusions du contexte d’engagement par rapport à la mission","Présenter le but à atteindre et les tâches spécifiées et induites de toutes les fonctions opérationnelles","Présenter les séquences ennemies et la séquence amie pour en déduire les zones clés définitives","Présenter les critères de comparaison du chef et une première ébauche des modes d’action amis"],a:0,e:"La phase préalable ne traite ni le but à atteindre (étape 1), ni les séquences (étapes 3 à 5), ni les MA (phase 2). Elle fixe le temps disponible (tiers-temps) et tire du contexte des conclusions par rapport à la mission."},
 {q:"Ordre reçu à H. Début de la conduite à H+15. Mouvement préalable de 3 h. Temps maximal pour élaborer l’ordre ?",o:["4 h","5 h","3 h","7 h 30"],a:0,e:"Temps disponible = 15 − 3 = 12 h ; tiers = 4 h."},
 {q:"Niveaux 4 et 3 : le chef décide de ne pas tenir d’orientation préalable. Que deviennent les conclusions du contexte ?",o:["Elles sont présentées à l’orientation initiale avec celles de l’analyse de la mission", "Elles sont présentées à la réunion de synthèse avec celles de l’analyse du terrain", "Elles sont seulement transmises par WINGO aux subordonnés, sans être présentées au chef", "Elles ne sont présentées que si certaines ont évolué depuis la réception de la mission"],a:0,e:"Sans orientation préalable, rien n’est perdu : les conclusions du contexte rejoignent celles de l’analyse de la mission à l’orientation initiale."},
 {q:"La frise chronologique, en phase préalable…",o:["est obligatoire et débute avec les 1res tâches interarmes et les dates importantes du contexte","est facultative et n’est ouverte qu’après la validation du but à atteindre en orientation initiale","est obligatoire mais ne débute qu’avec la séquence amie des tâches interarmes de l’étape 4","est facultative et ne recense que les dates critiques du contexte (fêtes, commémorations)"],a:0,e:"« Début de la frise chronologique obligatoire »."},
 {q:"Le domaine « délais » du contexte couvre notamment…",o:["saison, lever / coucher du soleil, durées jour / nuit, phase de la lune, dates critiques","délais de réalisation de nos tâches avant et pendant la mission, et moyens nécessaires associés","délais de notre ennemi global et élaboration de ses séquences d’action dans la zone","moment clé d’obtention de l’effet majeur et GDH des points de décision"],a:0,e:"Les délais des tâches amies relèvent de l’étape 4 de la phase 1."},
 {q:"En phase préalable, quel ennemi étudie-t-on ?",o:["Les éléments de niveau supérieur et égal à l’ennemi de notre supérieur, et les autres parties prenantes","Notre ennemi global et notre ennemi futur, avec leurs moyens, leurs capacités, leurs forces et leurs faiblesses","Les éléments ennemis du niveau de nos subordonnés, sans les autres parties prenantes (populations, acteurs)","Les seules unités ennemies au contact, décrites dans le paragraphe renseignement de l’ordre reçu"],a:0,e:"En phase préalable, on regarde large : l’ennemi de notre supérieur (niveau supérieur et égal) et les autres parties prenantes. L’ennemi global et l’ennemi futur relèvent de l’étape 3, « Qui serait-il ? »."},
 {q:"Comment qualifie-t-on la liberté d’action ?",o:["Contrainte ou non contrainte, avec des conclusions pour valoriser ou pour compenser","Forte, moyenne ou faible, avec des conclusions pour exploiter ou pour subir la situation","Totale ou partielle, avec une présupposition à vérifier avant l’action","Favorable ou défavorable, avec un rapport de forces chiffré en 1re approche"],a:0,e:"Même formule à chaque étape de la phase 1."},
 {q:"À quel moment l’orientation préalable peut-elle avoir lieu ?",o:["Dès les premiers WINGO reçus, avant même la réception formelle de la mission","Après l’orientation initiale, pour compléter l’analyse de la mission par le contexte","Seulement après réception de l’OPO du supérieur et de son mission brief","À la fin de la phase 1, juste avant la proposition d’effet majeur"],a:0,e:"« Cette réunion peut avoir lieu suite aux premiers WINGO reçus de l’échelon supérieur, alors que l’on n’a pas encore formellement reçu notre mission. »"},
 {"q":"Durée indicative d’une MEDOT de GTIA pour un ordre initial ?","o":["7 à 8 h","2 h","15 à 16 h","Au moins 24 h"],"a":0,"e":"Repères : BIA 10 à 12 h, GTIA 7 à 8 h, SGTIA 4 à 5 h, section 2 h"},
 {"q":"Durée indicative d’une mission de GTIA en haute intensité ?","o":["6 à 12 h","2 à 4 h","18 à 36 h","108 h"],"a":0,"e":"Mission BIA 18 à 36 h, mission GTIA 6 à 12 h, mission SGTIA 2 à 4 h ; MAG DIV jusqu’à 108 h"},
 {"q":"L’analyse du contexte d’engagement est-elle reprise pendant la phase 1 ?","o":["Non : elle est menée en phase préalable","Oui, à chaque étape de la phase 1","Oui, à l’analyse du terrain ami","Oui, à la réunion de synthèse"],"a":0,"e":"Il n’y a pas d’analyse du contexte durant la phase 1"}
 ]},

{id:"p1e1",grp:"Phase 1 – Analyse-synthèse",title:"Étape 1 – Analyse de la mission",qtag:"Pourquoi ? Quoi ?",
 but:"Comprendre l’esprit (Pourquoi ?) et la lettre (Quoi ?) de la mission, et proposer une ou plusieurs formulations du but à atteindre.",
 sections:[
 {h:"Pourquoi ? – l’esprit de la mission",l:["Nos contributions à la manœuvre et à l’effet majeur de l’échelon supérieur","Conclusions sur les renforts et les efforts de l’échelon supérieur","Présuppositions éventuelles","Nouvelles tâches, contraintes, impératifs, demandes, besoins en renseignement, frise","Formulation(s) du but à atteindre"]},
 {h:"Quoi ? – la lettre de la mission",l:["Liste des tâches spécifiées et induites à réaliser (avant, pendant et après la mission), pour toutes les fonctions opérationnelles","Qualification de notre liberté d’action par rapport à la mission : contrainte ou non ; conclusions pour valoriser ou compenser","Présuppositions éventuelles","Nouvelles tâches, contraintes, impératifs, demandes, besoins en renseignement, frise"]},{"h":"Compléments","l":["Exprimer la contribution de chaque tâche : « [tâche de notre mission], ce qui permet à l’échelon supérieur de… » ; idem pour les tâches de notre « en mesure de ».","Étudier aussi la contribution de notre niveau à l’effet majeur du supérieur, ainsi que ses renforts et ses efforts.","Pas de reformulation de la mission en opération nationale. Elle n’est nécessaire qu’en opération interalliée, quand la mission reçue n’existe pas en doctrine française : on la formule alors en termes réglementaires français, on la propose au chef à l’orientation initiale et on la soumet au supérieur pour approbation.","Tâches interarmes dans un tableau, tâches spécifiques de chaque fonction dans des tableaux distincts ; la liste finalisée des tâches interarmes deviendra la séquence amie."]}],
 vig:["Le but à atteindre est tourné vers le supérieur (sa manœuvre ou son ennemi) et commence par « En vue de » ou « Afin de ».","Les tâches couvrent toutes les fonctions opérationnelles, pas seulement le contact.","Distinguer tâches spécifiées (écrites dans les ordres) et induites (déduites).","Le but à atteindre n’est pas l’effet majeur du supérieur : le « pourquoi ? » ne se résume presque jamais à le recopier."],
 apply:[
  {t:"note",x:"Recopie la mission et l’intention du supérieur, puis réponds à « Pourquoi ? » : ce que tes tâches apportent à sa manœuvre et à son effet majeur. Propose une ou deux formulations du but à atteindre (« Afin de… », tournées vers le supérieur ou son ennemi, jamais vers ta propre action). Réponds ensuite à « Quoi ? » : toutes les tâches spécifiées et induites, de toutes les fonctions, avant, pendant et après la mission ; pour chaque tâche induite, note d’où tu la déduis."},
  {t:"fields",id:"mis",f:[{k:"msup",l:"Mission de l’échelon supérieur (rappel)",a:1},{k:"isup",l:"Intention du supérieur : but à atteindre et effet majeur",a:1},{k:"contrib",l:"Contribution de nos tâches à la manœuvre et à l’effet majeur du supérieur",a:1},{k:"renf",l:"Renforts et efforts de l’échelon supérieur",a:1},{k:"bat",l:"Formulation(s) du but à atteindre",a:1,h:"Commence par « En vue de » ou « Afin de ».",chk:"bat"}]},
  {t:"table",id:"taches",cols:[{k:"t",l:"Tâche",ph:"Ex. : coordonner le recueil avec le GTIA BRAVO"},{k:"n",l:"Nature",o:["Spécifiée","Induite"]},{k:"fo",l:"Fonction opérationnelle",o:FO},{k:"m",l:"Moment",o:["Avant","Pendant","Après"]},{k:"s",l:"Source / justification",ph:"Ex. : induite du recueil de nuit au nord de la Sarve"}]},
  {t:"fields",id:"misla",f:[{k:"la",l:"Liberté d’action par rapport à la mission",o:["","Non contrainte","Contrainte"]},{k:"vc",l:"Conclusions pour valoriser ou compenser",a:1},{k:"pp",l:"Présuppositions éventuelles",a:1}]},
  {t:"tcidr"},{t:"frise"}],
 quiz:[
 {q:"L’analyse de la mission répond à deux questions. Lesquelles ?",o:["Pourquoi ? (esprit) et Quoi ? (lettre)","Où ? (terrain) et Quand ? (délais)","Contre qui ? (ennemi) et Avec qui ? (amis)","Comment ferait l’ennemi ? et Comment ferons-nous ?"],a:0,e:"Où = terrain, Contre qui = ennemi, Avec qui = amis, Quand = confrontation."},
 {q:"Où trouve-t-on les tâches spécifiées ?",o:["Dans les ordres écrits du supérieur (OPLAN, PS, OPORD, FRAGO…)","Dans les déductions que nous tirons de l’analyse de la mission reçue","Dans la séquence amie des tâches interarmes établie à l’étape 4","Dans les directives données par notre chef à l’orientation initiale"],a:0,e:"Les tâches induites, elles, sont déduites."},
 {q:"Laquelle de ces formulations est un but à atteindre recevable ?",o:["« Afin de permettre à la brigade de franchir la rivière dans les délais »", "« Afin de nous emparer de la cote 204 en deux temps avec deux compagnies »", "« En détruisant l’ennemi sur la position X avant H+6 »", "« Afin que nos sections disposent de délais suffisants pour s’installer »"],a:0,e:"Le but à atteindre est tourné vers le niveau supérieur (sa manœuvre ou son ennemi). Les autres propositions décrivent notre propre action (le comment), n’ont pas la forme requise ou sont tournées vers nos subordonnés."},
 {q:"Les tâches listées à l’étape 1 concernent…",o:["toutes les fonctions opérationnelles, avant, pendant et après la mission", "toutes les fonctions opérationnelles, uniquement pendant la mission", "les seules unités de mêlée, avant, pendant et après la mission", "les seules tâches spécifiées, pour toutes les fonctions opérationnelles"],a:0,e:"Tableaux interarmes et tableaux propres à chaque fonction opérationnelle."},
 {q:"Quelle réunion suit l’analyse de la mission et fait valider le but à atteindre ?",o:["L’orientation initiale","La réunion de synthèse","La réunion de décision","L’orientation préalable"],a:0,e:"Synthèse = effet majeur ; décision = mode d’action."},
 {q:"Les conclusions sur les renforts et les efforts de l’échelon supérieur relèvent de…",o:["l’esprit de la mission (Pourquoi ?)", "la lettre de la mission (Quoi ?)", "l’analyse des forces amies (Avec qui ?)", "la phase préalable (contexte d’engagement)"],a:0,e:"Tableau de la phase 1, et canevas de l’orientation initiale (finalité de la mission)."},
 {q:"À l’orientation initiale, que rappelle-t-on de l’intention de l’échelon supérieur ?",o:["Son but à atteindre et son effet majeur","Sa mission et son idée de manœuvre détaillée","Ses critères de comparaison des modes d’action","Ses renforts et ses efforts"],a:0,e:"Canevas : « rappel de l’intention de l’échelon supérieur (but à atteindre et effet majeur) »."},
 {"q":"Le but à atteindre peut-il reprendre l’effet majeur du supérieur ?","o":["Presque jamais : il synthétise nos contributions à la manœuvre du supérieur","Oui, c’est la règle","Oui, s’il est rédigé à la voix passive","Non : il reprend la mission du supérieur"],"a":0,"e":"Seul cas particulier : l’unité réalise l’effet majeur du supérieur dans le temps de sa réalisation ; le but peut alors être d’y participer"},
 {"q":"En opération nationale, reformule-t-on la mission reçue ?","o":["Non : la reformulation n’est nécessaire qu’en opération interalliée","Oui, toujours, à l’orientation initiale","Oui, si le chef le décide","Non, sauf au niveau 4"],"a":0,"e":"En interallié, la mission est formulée en termes réglementaires français et soumise au supérieur"},
 {"q":"Quelle formule exprime la contribution d’une tâche à la manœuvre du supérieur ?","o":["« …, ce qui permet à l’échelon supérieur de… »","« Face à notre action… »","« Je veux… »","« En mesure de… »"],"a":0,"e":"Formule à appliquer à chaque tâche de la mission et de l’« en mesure de »"}
 ]},

 {h:"Produits",l:["Directives du chef tactique au groupe plurifonctionnel de conception","Synthèse réalisée par le groupe plurifonctionnel de conception","Compte rendu vers l’échelon supérieur et WINGO vers les subordonnés (partage d’analyse)"]}
 ],

 quiz:[
 {q:"Qui participe à la réunion d’orientation initiale ?",g:"reu-participants",o:["Le chef tactique et le groupe plurifonctionnel de conception", "Le chef tactique, son supérieur et les commandants d’unité subordonnés", "Le chef d’état-major et les chefs de cellule, sans le chef tactique", "Le groupe plurifonctionnel de conception et les officiers de liaison"],a:0,e:"Même participation pour les trois réunions du processus."},
 {q:"Quel est l’élément clé que le chef valide à cette réunion ?",o:["Le but à atteindre","L’effet majeur","Le mode d’action définitif","Les critères de comparaison"],a:0,e:"L’effet majeur est validé en synthèse, le MA en décision."},

 {q:"Le problème tactique présenté à l’orientation initiale est…",o:["une 1re approche, affinée pendant la phase 1 et arrêtée à la réunion de synthèse", "une 1re approche, affinée pendant la phase 2 et arrêtée à la réunion de décision", "définitif, car il découle directement de la mission reçue du supérieur", "une 1re approche, arrêtée dès la fin de l’orientation initiale par le chef"],a:0,e:"Le problème tactique mûrit pendant toute la phase 1 : 1re approche à l’orientation initiale, version définitive à la réunion de synthèse."},

 sections:[{h:"Conclusions attendues",l:["Conclusions sur le terrain physique, le terrain humain et la météorologie","Points clés et ébauche de la zone clé par rapport à notre mission (ou MAG)","Qualification de notre liberté d’action par rapport au terrain ami ; conclusions pour valoriser ou compenser","Présuppositions éventuelles","Nouvelles tâches, contraintes, impératifs, demandes, besoins en renseignement, frise"]},
 {h:"Support présenté en synthèse",p:"Le calque terrain environnement (CTE)."},{"h":"Compléments","l":["Terrain physique : description générale de la zone d’opération, des compartiments de terrain, des points clés et d’une ébauche de zone clé.","Environnement humain des opérations : population, contextes, information, facteurs, organisations, opérateurs ; pour chacun, des conclusions par rapport aux tâches.","Météorologie : phénomènes et conséquences sur la mission et les tâches (domaine déjà vu en phase préalable, dont on précise ici les conséquences).","Ne négliger aucun champ, physique ou immatériel. La cellule géographie du bureau renseignement réalise le calque terrain environnement (CTE)."]}],

{id:"p1e3",grp:"Phase 1 – Analyse-synthèse",title:"Étape 3 – Analyse des forces ennemies",qtag:"Contre qui ?",
 but:"Décrire notre ennemi global, ses objectifs supposés, ses capacités et ses délais, jusqu’à l’élaboration de ses séquences.",
 sections:[{h:"Trois questions et conclusions",l:["Qui serait-il ? Description de notre ennemi global et de notre ennemi futur","Que voudrait-il ? Objectifs de notre ennemi global","Que pourrait-il ? Moyens, capacités, forces et faiblesses par rapport à ses objectifs ; conclusions sur le terrain ennemi (points clés, zone clé) ; délais ennemis (élaboration des séquences de notre ennemi global)","Nouvelles tâches, contraintes, impératifs, demandes, besoins en renseignement, frise"]},{"h":"Compléments","l":["Toujours se mettre dans le cas le plus défavorable.","Ennemi global : celui que l’on rencontre dans le cadre espace-temps de notre mission. En fait partie l’ennemi dont on subit les actions sans le rencontrer (artillerie, cyber, influence) ; n’en fait pas partie l’ennemi qui traverse notre fuseau sans être rencontré pendant la mission, ni celui qui est l’objectif d’une unité amie (au pire, ses reliquats).","Une unité en appui ou en soutien a le même ennemi global que l’unité appuyée ou soutenue.","Ennemi futur : celui de notre « en mesure de ». Ne pas oublier les reliquats des combats précédents.","Terrain ennemi : ses points clés, voire sa zone clé, et sa liberté d’action ; ne pas restreindre cette étude à notre seule zone d’opération.","Nombre de séquences ennemies selon les ME du supérieur : si ses deux ME concernent notre ennemi global, une séquence (deux si les ME sont trop différents pour être synthétisés) ; si un seul le concerne, une séquence ; si aucun, une séquence qui lui permet d’atteindre ses objectifs dans sa zone."]}],
 vig:["En phase 1, on élabore des séquences ennemies, pas des modes d’action : les ME sont conçus en phase 2 (étape 1).","Les conditionnels (serait, voudrait, pourrait) rappellent qu’on raisonne sur un ennemi supposé : aucune présupposition sur l’ennemi.","La séquence ennemie n’est pas un ME : c’est une liste chronologique d’actions, principalement au contact.","On ne raisonne pas sur l’ennemi pour prédire sa manœuvre mais pour décider de la manœuvre amie."],
 apply:[{t:"note",x:"Réponds aux trois questions dans l’ordre : Qui serait-il ? Que voudrait-il ? Que pourrait-il ? (forces et faiblesses par rapport à SES objectifs, terrain ennemi). Construis ensuite la séquence de l’ennemi global avec des GDH : elle s’affiche sur la frise. Pas de présupposition sur l’ennemi : ce que tu ignores devient un besoin en renseignement."},{t:"fields",id:"eni",f:[{k:"qui",l:"Qui serait-il ? (ennemi global, ennemi futur)",a:1},{k:"quoi",l:"Que voudrait-il ? (objectifs supposés)",a:1},{k:"moy",l:"Que pourrait-il ? Moyens, capacités, forces et faiblesses",a:1},{k:"ter",l:"Terrain ennemi : points clés, zone clé",a:1}]},
  {t:"table",id:"seqeni",cols:[{k:"g",l:"GDH / délai"},{k:"a",l:"Action ennemie"},{k:"u",l:"Unités"},{k:"o",l:"Observations"}]},
  {t:"chart",k:"seqeni",l:"Séquence ennemie sur la frise"},

 quiz:[

 {q:"Quel produit sur les délais ennemis sort de l’étape 3 ?",o:["Les séquences de notre ennemi global","Les modes d’action ennemis","La matrice de synchronisation ennemie","Le plan de renseignement définitif"],a:0,e:"Les ME et leurs matrices viennent en phase 2."},
 {q:"Le terrain ennemi (points clés, zone clé) est étudié…",o:["à l’étape 3, dans « Que pourrait-il ? »", "à l’étape 3, dans « Qui serait-il ? »", "à l’étape 2, avec le terrain ami", "à l’étape 5, avec les zones clés définitives"],a:0,e:"Les conclusions sur le terrain ennemi (points clés, zone clé) relèvent de « Que pourrait-il ? »."},
 {q:"Pourquoi ne fait-on pas de présupposition sur l’ennemi ?",g:"presup-eni",o:["Parce qu’une présupposition doit être vérifiée avant l’action, ce qui est impossible pour l’ennemi","Parce que les présuppositions sont réservées aux niveaux 1 et 2, qui étudient l’ennemi en phase préalable","Parce que l’ennemi est déjà décrit par l’échelon supérieur, ce qui rend toute présupposition inutile","Parce que les présuppositions sur l’ennemi doivent être levées dès la réunion d’orientation initiale"],a:0,e:"Une présupposition doit être vérifiée avant l’action ; le comportement de l’ennemi ne peut être que supposé. Ce qu’on ignore de l’ennemi devient un besoin en renseignement."},
 {q:"Que décrit-on en répondant à « Qui serait-il ? » ?",o:["Notre ennemi global et notre ennemi futur", "Les objectifs supposés de notre ennemi global", "Les moyens, capacités, forces et faiblesses ennemis", "Les éléments ennemis du niveau de notre supérieur"],a:0,e:"Les éléments ennemis du niveau du supérieur relèvent de la phase préalable."},

 {"q":"Un ennemi qui est l’objectif d’une unité amie, dans notre cadre espace-temps, appartient-il à notre ennemi global ?","o":["Non : au pire, nous ferons face à ses reliquats","Oui, dès qu’il est dans notre fuseau","Oui, s’il est de niveau N-1","Non : il relève de notre ennemi futur"],"a":0,"e":"L’ennemi global s’apprécie dans l’espace et dans le temps de notre mission"},

{id:"p1e4",grp:"Phase 1 – Analyse-synthèse",title:"Étape 4 – Analyse des forces amies",qtag:"Avec qui ?",
 but:"Évaluer les délais et les moyens nécessaires à nos tâches, les comparer aux moyens réellement disponibles et bâtir la séquence amie.",
 sections:[{h:"Conclusions attendues",l:["Quels seraient les délais pour réaliser nos tâches (avant et pendant la mission) ?","Quels seraient les moyens nécessaires pour réaliser nos tâches ?","Quels sont nos moyens et nos capacités réellement disponibles ?","Séquence amie des tâches interarmes (tâches, délais, unités associées)","Qualification de notre liberté d’action par rapport aux forces amies ; conclusions pour valoriser ou compenser","Présuppositions éventuelles","Nouvelles tâches, contraintes, impératifs, demandes, besoins en renseignement, frise"]},{"h":"Compléments","l":["Délais : chaque tâche interarmes reçoit un GDH de début et de fin en 1re approche, y compris les tâches antérieures au débouché (mouvement et actions en ZDO, modelage) ; pas encore de réflexion sur la simultanéité ni la faisabilité.","Moyens nécessaires : affectés par tâche, désignés de façon générique (EFA, CAESAR, GTIA, SGTIA…), sans nommer les unités sauf unités spécifiques ou uniques ; ne pas déclarer une tâche irréalisable à ce stade.","Moyens disponibles au moment de l’analyse : organiques, renforts (horaires, délégation de commandement), appuis déjà prévus. Si un moyen nécessaire n’est pas encore disponible (force pas encore FOC…), on pose une présupposition, à lever au plus tard avant la conception des MA.","Points forts et points faibles par rapport à la mission, y compris forces morales, capacités dans les champs immatériels, caveats (restrictions propres à chaque nation) et ROE (valables pour toute la force).","Séquence amie : adéquation des moyens disponibles aux tâches, puis études des simultanéités, fusionnements, requalifications, incompatibilités et discontinuités ; l’inventaire des moyens nécessaires reste la référence des demandes."]}],
 vig:["Un écart entre moyens nécessaires et moyens réellement disponibles contraint notre liberté d’action : il appelle des conclusions pour compenser, notamment des demandes (le D du TCIDR).","La séquence amie porte sur des tâches interarmes, pas encore sur un mode d’action.","La séquence amie n’est pas un MA. Il est trop tôt pour parler de phasage : il dépend du mode d’action et reste une conclusion de phase 2."],
 apply:[{t:"note",x:"Liste les tâches interarmes dans l’ordre chronologique, estime leur délai, puis compare les moyens nécessaires aux moyens réellement disponibles. Chaque écart débouche sur une conclusion : une demande au supérieur ou une mesure pour compenser."},{t:"table",id:"seqami",cols:[{k:"t",l:"Tâche interarmes"},{k:"dl",l:"Délai estimé"},{k:"mn",l:"Moyens nécessaires"},{k:"md",l:"Moyens disponibles"},{k:"ec",l:"Écart → conclusion",ph:"Ex. : 1 seul escadron de chars → demande d’appui feux BIA"}]},

{id:"p1e5",grp:"Phase 1 – Analyse-synthèse",title:"Étape 5 – Confrontation des séquences ennemis-amis",qtag:"Quand ?",
 but:"Confronter les séquences ennemies à la séquence amie pour en déduire opportunités, risques, actions décisives, zones clés et moment clé.",
 sections:[{h:"Conclusions attendues",l:["Opportunités et risques, et éventuelles actions décisives associées","La ou les zones clés définitives de la zone d’opération","Rapports de force (quantitatifs) en 1re approche des actions décisives","Le moment clé d’obtention de l’effet majeur, en 1re approche","Nouvelles tâches, contraintes, impératifs, demandes, besoins en renseignement, frise"]},{"h":"Compléments","l":["Raisonner par les effets : d’abord l’effet à obtenir, ensuite l’action (directe ou indirecte, sur l’ennemi ou le terrain) qui permettra de l’obtenir.","Un risque significatif est contré, une opportunité significative est valorisée, par un effet particulier : résultat d’une tâche nouvelle ou valorisée, qui peut être une action décisive.","Les actions décisives sont conçues pour réaliser notre séquence, pas pour interrompre systématiquement la séquence ennemie : l’ennemi peut dérouler sa séquence et tomber dans le piège préparé.","Zone clé : si le lieu d’une action décisive coïncide avec l’ébauche de zone clé, celle-ci est confirmée ; sinon, ce lieu devient une seconde zone clé.","Moment clé : cadre temporel d’obtention de l’effet majeur (fin de l’action décisive). Au niveau 4, souvent un GDH précis ; au niveau 3, souvent une plage (de tel GDH à tel GDH, de telle lima à telle lima, progressivement…).","Rapport de force : étude quantitative en 1re approche, relativisée selon la nature offensive ou défensive des engagements et l’environnement. Les fonctions ne s’opposent pas une à une : l’ennemi de l’artilleur n’est pas uniquement l’artilleur ennemi."]}],
 vig:["On confronte ici des séquences (phase 1), pas des modes d’action : la confrontation MA-ME est l’étape 5 de la phase 2.","Rapports de force et moment clé restent en 1re approche.","Cette étape débouche directement sur la proposition d’effet majeur.","Les séquences ennemies ne sont jamais amendées : les actions décisives s’intègrent dans la séquence amie.","Plusieurs actions décisives (et zones clés) sont possibles : en synthèse, une seule est retenue, les autres deviennent des impératifs.","Le moment clé n’est pas le moment de bascule du rapport de force, étudiée en phase 2."],
 apply:[{t:"note",x:"Mets côte à côte, temps par temps, ta séquence amie (étape 4) et la séquence ennemie (étape 3). À chaque rencontre, qualifie l’opportunité ou le risque et l’action décisive éventuelle. Déduis-en la zone clé définitive et le moment clé, puis rédige ta proposition d’effet majeur : action décisive, adversaire, lieu, moment."},{t:"table",id:"conf",cols:[{k:"g",l:"Temps / GDH"},{k:"a",l:"Séquence amie"},{k:"e",l:"Séquence ennemie"},{k:"r",l:"Opportunité / risque",o:["","Opportunité","Risque"]},{k:"ad",l:"Action décisive associée",ph:"Ex. : feux BIA concentrés sur le débouché de la trouée de Vernes"},{k:"rf",l:"Rapport de force (1re approche)"}]},

 <p><b>Par où commencer ?</b> Si tu découvres la méthode, ou si tu la reprends après une longue coupure, commence par le <b>Vocabulaire</b>, puis suis les étapes dans l’ordre du cycle ci-dessous. La navigation reste libre : tu peux revenir sur une étape à tout moment.</p>
 <p>Chaque étape se travaille en trois temps, dans cet ordre conseillé :</p>
 <ul class="c"><li><b>1 · Comprendre</b> : la synthèse doctrinale, avec une <b>fiche réflexe</b> à imprimer ou à copier.</li>
 <li><b>2 · S’entraîner</b> : un test corrigé ; l’étape est validée à partir de ${PASS*100} %.</li>
 <li><b>3 · Appliquer</b> : les gabarits de l’étape, à remplir sur un cas. Pour voir un exemple sur le thème VIENNE (33(AZ)BB, propositions à valider), active <b>« Exemple VIENNE »</b> en haut de l’écran : tes saisies ne sont pas touchées.</li></ul>
 <p><b>Outils</b> : un examen blanc (30 questions en 30 minutes, sur tout le parcours ou sur une phase), une recherche dans les sigles et les définitions, et la vue consolidée des TCIDR et de la frise. Tes saisies restent dans ce navigateur : <b>sauvegarde-les</b> (bas de page) avant de changer de poste.</p>
 <p><b>Après la MEDOT</b> : la rubrique « Appropriation et conduite » traite à part les réunions qui suivent la décision (mission brief, back brief, rehearsal), celles de la conduite (point de situation, APPSIT) et les rôles au sein du CO de GTIA. Le groupe Outils propose aussi les normes et délais (fiche et calculateur).</p>
 <p class="ref">Outil pédagogique : il ne remplace pas la PFT 5.1. « La méthode ordonne la réflexion mais ne la bride pas. »</p></div>${vids("accueil")}
 <h3>Le cycle MEDOT (niveaux 3 et 4)</h3>
 <div class="cycle-svg">${cycleSvg()}</div>
 <div class="cycle">
 ${box("Phase préalable",[["vocab","Vocabulaire (pour commencer)"],["prealable","Analyse du contexte d’engagement"]])}
 ${box("Phase 1 – Analyse-synthèse",[["p1e1","1. Analyse de la mission"],["oi","Réunion d’orientation initiale (but à atteindre)",1],["p1e2","2. Analyse du terrain ami"],["p1e3","3. Analyse des forces ennemies"],["p1e4","4. Analyse des forces amies"],["p1e5","5. Confrontation des séquences"],["syn","Réunion de synthèse (effet majeur)",1]])}
 ${box("Phase 2 – Conception de la manœuvre",[["p2e1","1. Conception des ME"],["p2e2","2. Conception des MA"],["p2e3","3. Manœuvres fonctionnelles"],["p2e4","4. Comparaison des MA"],["p2e5","5. Confrontation MA-ME"],["p2e6","6. Finalisation des MA"],["dec","Réunion de décision (MA définitif)",1],["pm","Finalisation du plan de manœuvre"]])}
 </div>
 <h3>Après la MEDOT : appropriation et conduite</h3>
 <div class="cycle">${box("Hors cycle MEDOT",[["ac_mb","Mission brief",1],["ac_bb","Back brief",1],["ac_rh","Rehearsal",1],["ac_ps","Point de situation",1],["ac_as","Appréciation de situation (APPSIT)",1],["ac_co","Rôles au sein du CO de GTIA"]])}</div>
 <div class="card"><h3>Ma progression</h3>${CHARTS.scores()}<div class="rowb"><button class="btn dk" onclick="go('exam')">Passer l’examen blanc</button>${exBestTxt()?`<span class="ref" style="align-self:center">${exBestTxt()}</span>`:""}</div></div>
 <div class="card"><h3>Cas concret (instructeur)</h3><p>${CAS?`Cas chargé : <b>${esc(CAS.titre)}</b> – corrigé disponible pour ${Object.keys(CAS.corrige).filter(k=>M.some(m=>m.id===k)).length} étape(s).`:"L’instructeur charge un fichier de cas (.json) contenant la situation et le corrigé de chaque étape : le corrigé s’affiche alors dans l’onglet « Appliquer » de chaque étape. Il reste dans ce navigateur jusqu’à son retrait."}</p>
 <p class="ref">Pour créer un cas : remplis les gabarits avec ta solution (ou active l’exemple VIENNE), puis « Créer un cas à partir de mes saisies ». Complète ensuite la situation et les commentaires (« texte ») dans le fichier.</p>
 <div class="rowb"><button class="btn" onclick="document.getElementById('fCas').click()">Charger un cas (instructeur)</button><input type="file" id="fCas" accept=".json,application/json" hidden onchange="importCas(this)"><button class="btn s" onclick="exportCasForm()">Créer un cas à partir de mes saisies</button>${CAS?`<button class="btn s" onclick="showSitu()">Lire la situation</button><button class="btn s" onclick="removeCas()">Retirer le cas</button>`:""}</div><div id="casMsg" role="status"></div></div>
 <div class="card"><h3>Sauvegarde</h3><p>Tes saisies restent dans ce navigateur. Pour changer de poste ou les rendre à l’instructeur :</p>
 <div class="rowb"><button class="btn" onclick="exportDoc()">Exporter mes travaux (Word)</button><button class="btn s" onclick="copyAll()">Copier mes travaux</button><button class="btn s" onclick="exportJson()">Sauvegarder (fichier .json)</button><button class="btn s" onclick="document.getElementById('fImp').click()">Reprendre une sauvegarde</button><input type="file" id="fImp" accept=".json" hidden onchange="importJson(this)"><button class="btn danger" onclick="resetAll()">Tout effacer</button></div><div id="ioMsg" role="status"></div></div>`;}

prealable:[["02_phase_prealable","Phase préalable","8 min"]],
