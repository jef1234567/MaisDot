function vids(id){const v=VID[id];if(!v)return "";return v.map(([f,t,d])=>`<div class="vid"><h3>▶ Vidéo de cours : ${esc(t)} <span class="d">(${d})</span></h3><video controls preload="none" playsinline src="videos/${f}.mp4" onerror="this.parentNode.classList.add('err')"></video><div class="ko">Vidéo indisponible. Sur le site ou l’appli installée, il faut une connexion ; sur un poste hors ligne (Intradef), copie le dossier <b>videos</b> à côté de <b>index.html</b>.</div></div>`).join("");}
function comprendre(m){let h=vids(m.id);
 if(m.but)h+=`<div class="rowb" style="justify-content:flex-end"><button class="btn s" onclick="fiche('${m.id}')">Fiche réflexe</button></div>`;
 if(m.intro)h+=`<p>${esc(m.intro)}</p>`;
 if(m.but)h+=`<div class="but"><b>But :</b> ${esc(m.but)}</div>`;
 if(m.cards)h+=`<div class="fc">${m.cards.map(c=>`<button type="button" class="fcd" aria-expanded="false" onclick="this.classList.toggle('flip');this.setAttribute('aria-expanded',this.classList.contains('flip'))"><span class="tt">${esc(c[0])}</span><span class="df">${esc(c[1])}</span><span class="hint">Toucher pour la définition</span></button>`).join("")}</div>`;
 (m.sections||[]).forEach(s=>{h+=`<div class="card"><h3>${esc(s.h)}</h3>${s.p?`<p>${esc(s.p)}</p>`:""}${s.l?`<ul class="c">${s.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`;});
 if(m.canevas)h+=`<div class="card"><h3>Canevas de la réunion</h3><ol>${m.canevas.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
 if(m.normes)h+=normesFiche();
 if(typeof NORM_LINKS!=="undefined"&&NORM_LINKS.includes(m.id))h+=`<div class="rowb"><button class="btn s" onclick="go('normes')">Voir les normes et délais</button><button class="btn s" onclick="go('normes','a')">Calculateur de délais</button></div>`;
 if(m.vig)h+=`<div class="vig"><b>Points de vigilance</b><ul class="c">${m.vig.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
 if(m.quiz&&!m.cards&&!m.reu&&m.id!=="prealable"&&/^Phase/.test(m.grp))h+=`<p class="ref">${/^Phase 2/.test(m.grp)
  ?"Chaque étape de la phase 2 se termine par la mise à jour des TCIDR (et de la frise, le cas échéant)."
  :"Chaque étape de la phase 1 se termine par la mise à jour des TCIDR et de la frise chronologique."}</p>`;
 return h;}

/* ---- quiz ---- */
let QZ={};
function quiz(m){if(!QZ[m.id])QZ[m.id]={order:shuffle(m.quiz.map((_,i)=>i)),opt:{},ans:{}};const z=QZ[m.id];
 let h=`<p>Réponds à chaque question : la correction s’affiche aussitôt.${S.quiz[m.id]?` Meilleur score : <b>${Math.round(S.quiz[m.id].best*100)} %</b>.`:""}</p>`;
 z.order.forEach((qi,n)=>{const q=m.quiz[qi];if(!z.opt[qi])z.opt[qi]=shuffle(q.o.map((_,i)=>i));const a=z.ans[qi];
  h+=`<div class="qz card"><div class="qq">${n+1}. ${esc(q.q)}</div>${z.opt[qi].map(oi=>{let c="";if(a!=null){if(oi===q.a)c="good";else if(oi===a)c="bad";}return `<button class="o ${c}" ${a!=null?"disabled":""} onclick="answer('${m.id}',${qi},${oi})">${esc(q.o[oi])}</button>`;}).join("")}${a!=null?`<div class="ex" id="qex_${qi}" role="status"><b>${a===q.a?"✔ Exact.":"✘ Inexact."}</b> ${esc(q.e)}</div>`:""}</div>`;});
 const nb=Object.keys(z.ans).length;
 if(nb===m.quiz.length){const ok=m.quiz.filter((q,i)=>z.ans[i]===q.a).length,r=ok/m.quiz.length;
  h+=`<div class="score ${r>=PASS?"ok":"ko"}" role="status">${ok} / ${m.quiz.length} – ${r>=PASS?"Étape validée ✓":"Relis la synthèse et recommence"}</div><div class="rowb"><button class="btn s" onclick="QZ['${m.id}']=null;render()">Recommencer</button></div>`;}
 return h;}
function answer(id,qi,oi){const m=M.find(x=>x.id===id),z=QZ[id];z.ans[qi]=oi;
 if(Object.keys(z.ans).length===m.quiz.length){const r=m.quiz.filter((q,i)=>z.ans[i]===q.a).length/m.quiz.length;const p=S.quiz[id]||{best:0};p.best=Math.max(p.best,r);p.last=r;S.quiz[id]=p;save();}
 FOCUS_NEXT="#qex_"+qi;const y=window.scrollY;render();window.scrollTo(0,y);}

/* ---- appliquer ---- */
function appliquer(m){let h="";(m.apply||[]).forEach(b=>{
 if(b.t==="note")h+=`<p>${esc(b.x)}</p>`;
 if(b.t==="tiers")h+=tiers();
 if(b.t==="normcalc")h+=normCalc();
 if(b.t==="chart")h+=`<div class="card"><h3>${esc(b.l)}</h3><div data-chart="${b.k}">${CHARTS[b.k]()}</div></div>`;
 if(b.t==="fields")h+=`<div class="card">${b.f.map(f=>fld(b.id,f)).join("")}</div>`;
 if(b.t==="table")h+=`<div class="card">${tbl(b)}</div>`;
 if(b.t==="canevas")h+=canevasChk(m);
 if(b.t==="opofrago"&&typeof acOpoFrago==="function")h+=acOpoFrago();
 if(b.t==="tcidr")h+=`<div class="card"><h3>TCIDR de l’étape</h3>${tcidrTbl(m.id)}</div>`;
 if(b.t==="frise")h+=`<div class="card"><h3>Frise chronologique – ajouts de l’étape</h3>${friseTbl(m.id)}</div>`;
 if(b.t==="sync")h+=`<div class="card"><h3>${esc(b.l||"Matrice de synchronisation")}</h3>${tbl(blkTab(b))}<p class="ref">GDH au format « J 06h00 », « J+1 02h00 », « J-1 18h00 ». Le point de décision (PD1, PD2…) place une étoile ★ sur le Gantt.</p></div><details class="card" ${(S.tab["sync_"+b.id]||[]).some(r=>r.d||r.f)?"open":""}><summary><b>Gantt – ${esc(b.l||"synchronisation")}</b> <span class="ref">(afficher / masquer)</span></summary><div data-chart="sync:${esc(b.id)}">${CHARTS.sync(b.id)}</div></details>`;
 if(b.t==="cmp"){const cr=val("synv","crit");h+=`<div class="but"><b>Critères interarmes du chef (réunion de synthèse) :</b> ${cr?esc(cr).replace(/\n/g,"<br>"):`<span class="warn">non renseignés – voir l’onglet « Appliquer » de la réunion de synthèse.</span>`}</div><div class="card"><h3>Comparaison pondérée des MA</h3>${tbl(blkTab(b))}<p class="ref">Poids 1 à 3 ; note « + » (avantage), « = » (neutre), « − » (inconvénient). Total = Σ poids × (+1 / 0 / −1).</p></div><div class="card"><h3>Résultat de la comparaison</h3><div data-chart="cmp">${CHARTS.cmp()}</div></div>`;}
 if(b.t==="mame")h+=`<div class="card"><h3>Confrontation MA × ME</h3>${tbl(blkTab(b))}</div><div class="card"><h3>Grille de confrontation</h3><div data-chart="mame">${CHARTS.mame()}</div></div>`;
 if(b.t==="pdm")h+=`<div class="card"><h3>Plan de manœuvre</h3>${tbl(blkTab(b))}</div><div class="card"><h3>Points de décision dans le temps</h3><div data-chart="pdm">${CHARTS.pdm()}</div></div>`;});
 h+=corrige(m);return h;}
function val(id,k){return (S.v[id]||{})[k]||"";}
function setv(id,k,v){(S.v[id]=S.v[id]||{})[k]=v;save();}
function fld(id,f){const v=val(id,f.k),fid=`f_${id}_${f.k}`,ax=`id="${fid}" ${f.h?`aria-describedby="${fid}_h"`:""}`;let inp;
 if(f.o)inp=`<select ${ax} onchange="setv('${id}','${f.k}',this.value)">${f.o.map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
 else if(f.a)inp=`<textarea rows="${Math.max(2,Math.ceil(v.length/80))}" ${ax} ${f.ph?`placeholder="${esc(f.ph)}"`:""} oninput="setv('${id}','${f.k}',this.value)${f.chk?";chkBat(this)":""}">${esc(v)}</textarea>`;
 else inp=`<input ${ax} ${f.ph?`placeholder="${esc(f.ph)}"`:""} value="${esc(v)}" oninput="setv('${id}','${f.k}',this.value)">`;
 return `<div class="fld"><label for="${fid}">${esc(f.l)}</label>${f.h?`<div class="h" id="${fid}_h">${esc(f.h)}</div>`:""}${inp}${f.chk?`<div class="chkmsg" role="status">${batMsg(v)}</div>`:""}</div>`;}
function batMsg(v){v=v.trim();if(!v)return "";const BAT={fr:/^(en vue d|afin d)/i,en:/^(with a view to|in order to)/i,it:/^(al fine d|allo scopo d)/i,es:/^(con vistas a|a fin de)/i,ar:/^(بهدف|من أجل)/,de:/^(um |mit dem ziel)/i};return (BAT[LANG]||BAT.fr).test(v)||BAT.fr.test(v)?'<span class="ok-msg">✓ Forme conforme (« En vue de » / « Afin de »). Vérifie qu’il est bien tourné vers le niveau supérieur.</span>':'<span class="warn">⚠ Le but à atteindre commence par « En vue de » ou « Afin de ».</span>';}
function chkBat(t){t.parentNode.querySelector(".chkmsg").innerHTML=batMsg(t.value);}
function tbl(b){let rows=S.tab[b.id];if(!rows){rows=b.fixed?b.fixed.map(d=>({d})):[{}];S.tab[b.id]=rows;}
 const nc=c=>c.s||(c.o&&Math.max(...c.o.map(o=>String(o).length))<=12)?"nw":"",wide=b.cols.length>=8;
 return `<div class="tw${wide?" wide":""}"><table><thead><tr>${b.cols.map(c=>`<th class="${nc(c)}">${esc(c.l)}</th>`).join("")}${b.fixed?"":`<th class="del"><span class="sr">Supprimer</span></th>`}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${b.cols.map(c=>c.ro?`<th scope="row" data-l="${esc(c.l)}">${esc(r[c.k])}</th>`:`<td class="${nc(c)}" data-l="${esc(c.l)}">${cell(b.id,i,c,r[c.k])}</td>`).join("")}${b.fixed?"":`<td class="del"><button class="btn x" title="Supprimer" aria-label="Supprimer la ligne ${i+1}" onclick="delRow('${b.id}',${i})">✕</button></td>`}</tr>`).join("")}</tbody></table></div>${b.fixed?"":`<button class="btn s" onclick="addRow('${b.id}')">+ Ajouter une ligne</button>`}`;}
function cell(tid,i,c,v){if(c.ro)return `<b>${esc(v)}</b>`;
 const al=`aria-label="${esc(c.l)}, ligne ${i+1}"`,ph=c.ph&&i===0?` placeholder="${esc(c.ph)}"`:"";if(c.o)return `<select ${al} onchange="setc('${tid}',${i},'${c.k}',this.value)">${(c.o[0]===""?c.o:[""].concat(c.o)).map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
 if(c.s)return `<input ${al}${ph} value="${esc(v)}" oninput="setc('${tid}',${i},'${c.k}',this.value)">`;
 return `<textarea rows="${Math.max(2,Math.ceil(String(v||"").length/22))}" ${al}${ph} oninput="setc('${tid}',${i},'${c.k}',this.value)">${esc(v)}</textarea>`;}
function setc(t,i,k,v){S.tab[t][i][k]=v;save();refreshCharts();}
function addRow(t){S.tab[t].push({});save();FOCUS_NEXT=`[onclick="addRow('${t}')"]`;keep();
 const bt=document.querySelector(`[onclick="addRow('${t}')"]`),tr=bt&&bt.previousElementSibling&&bt.previousElementSibling.querySelector("tbody tr:last-child");
 const f=tr&&tr.querySelector("input,select,textarea");if(f)f.focus();}
function delRow(t,i){S.tab[t].splice(i,1);save();keep();}
function keep(){const y=window.scrollY;render();window.scrollTo(0,y);}
function canevasChk(m){const c=(S.v["cv_"+m.id]||{});const n=m.canevas.filter((_,i)=>c[i]).length;
 return `<div class="card chk"><h3>Je prépare ma réunion : canevas <span class="tag">${n} / ${m.canevas.length}</span></h3><p class="ref">Coche chaque rubrique dès que ta présentation la couvre.</p>${m.canevas.map((x,i)=>`<label><input type="checkbox" ${c[i]?"checked":""} onchange="setv('cv_${m.id}',${i},this.checked);keep()"> ${esc(x)}</label>`).join("")}</div>`;}

/* ---- TCIDR & frise globaux ---- */
function shortT(m){const p=/^Phase 1/.test(m.grp)?"Ph. 1 – ":/^Phase 2/.test(m.grp)?"Ph. 2 – ":"";return /^Étape/.test(m.title)?p+m.title.replace(/ –.*/,""):m.title.replace(/ –.*/,"");}
function progT(m){const p=/^Phase 1/.test(m.grp)?"Ph. 1 – ":/^Phase 2/.test(m.grp)?"Ph. 2 – ":"";return p+m.title.replace(/^Étape (\d) – /,"$1. ");}
function title(id){const m=M.find(x=>x.id===id);return m?shortT(m):id;}
function tcidrTbl(id){const L=S.tcidr.map((r,i)=>[r,i]).filter(([r])=>!id||r.src===id);
 return (!L.length?`<p class="ref">Aucun TCIDR ${id?"pour cette étape":"pour l’instant"}.</p>`:`<div class="tw"><table><thead><tr><th>Type</th><th>Libellé</th><th>Fonction opérationnelle</th>${id?"":"<th>Origine</th>"}<th class="del"><span class="sr">Supprimer</span></th></tr></thead><tbody>${L.map(([r,i])=>`<tr><td data-l="Type"><select aria-label="Type, ligne ${i+1}" onchange="S.tcidr[${i}].y=this.value;save();refreshCharts()">${TCIDR_TYPES.map(o=>`<option value="${esc(o)}" ${o===r.y?"selected":""}>${o}</option>`).join("")}</select></td><td data-l="Libellé"><textarea rows="2" aria-label="Libellé, ligne ${i+1}" oninput="S.tcidr[${i}].l=this.value;save()">${esc(r.l)}</textarea></td><td data-l="Fonction opérationnelle"><select aria-label="Fonction opérationnelle, ligne ${i+1}" onchange="S.tcidr[${i}].fo=this.value;save()">${FO.map(o=>`<option value="${esc(o)}" ${o===r.fo?"selected":""}>${esc(o)}</option>`).join("")}</select></td>${id?"":`<td data-l="Origine">${esc(title(r.src))}</td>`}<td class="del"><button class="btn x" aria-label="Supprimer la ligne ${i+1}" onclick="S.tcidr.splice(${i},1);save();keep()">✕</button></td></tr>`).join("")}</tbody></table></div>`)+`${id?`<button class="btn s" onclick="S.tcidr.push({src:'${id}',y:'Tâche',fo:'Interarmes',l:''});save();keep()">+ Ajouter un TCIDR</button>`:""}`;}

/* ============ GRAPHIQUES ============ */
function gdhKey(g){g=String(g||"").trim();const m=g.match(/^J\s*([+\-−]\s*\d+)?\s*(\d{1,2})\s*[h:]\s*(\d{2})?/i);
 if(m){const d=m[1]?parseInt(m[1].replace(/[\s−]/g,c=>c==="−"?"-":"")):0;return d*1440+parseInt(m[2])*60+(parseInt(m[3])||0);}
 const x=Date.parse(g);return isNaN(x)?null:x/6e4;}
function gdhCmp(a,b){const ka=gdhKey(a),kb=gdhKey(b);if(ka!=null&&kb!=null)return ka-kb;if(ka!=null)return -1;if(kb!=null)return 1;return String(a||"").localeCompare(String(b||""));}

 tcidr(){const n=TCIDR_TYPES.map(t=>S.tcidr.filter(r=>r.y===t).length),mx=Math.max(1,...n),col=["#B3121F","#5A6068","#A86B00","#1F5F99","#2E7D4F"];

 frise(){const L=S.frise.filter(r=>r.g||r.e).slice().sort((a,b)=>gdhCmp(a.g,b.g));if(!L.length)return `<p class="ref">Aucun repère pour l’instant : ajoute-les dans l’onglet « Appliquer » de chaque étape.</p>`;

 /* Gantt de synchronisation : une barre par ligne, couleur par fonction opérationnelle, ★ = point de décision */

  const K=R.map(r=>{let a=gdhKey(r.d),b=gdhKey(r.f);if(a==null)a=b;if(b==null)b=a;if(a!=null&&b<a)[a,b]=[b,a];return {r,a,b};});
  const all=K.filter(x=>x.a!=null).flatMap(x=>[x.a,x.b]);

  return `<div class="legend">${used.map(f=>`<span><i style="background:${FO_COL[f]||"#888"}"></i>${esc(f)}</span>`).join("")}<span><b class="pdk">★</b> Point de décision</span></div>
  <div class="gantt" role="list" aria-label="Gantt de synchronisation"><div class="gr ax" aria-hidden="true"><span class="lbl"></span><div class="ticks">${tkL}</div></div>
  ${K.map(({r,a,b})=>{const c=FO_COL[r.fo]||"#6B7179",txt=`${r.d||"?"} → ${r.f||"?"}`;
   return `<div class="gr" role="listitem"><div class="lbl"><b>${esc(r.u)}</b> ${esc(r.a)}${r.pd?` <span class="pdk">★ ${esc(r.pd)}</span>`:""}<small>${esc(txt)}${r.ph?" · "+esc(r.ph):""}${r.fo?" · "+esc(r.fo):""}</small></div><div class="trk" aria-hidden="true">${grid}${a==null?`<span class="na">GDH à préciser</span>`:`<span class="bar" title="${esc(txt)}" style="left:${pc(a)}%;width:${Math.max(0,pc(b)-pc(a))}%;background:${c}"></span>${r.pd?`<span class="pd" style="left:${pc(b)}%">★</span>`:""}`}</div></div>`;}).join("")}</div>`;},
 /* Comparaison pondérée */
 cmp(){const R=(S.tab.cmp||[]).filter(r=>r.c);if(!R.length)return `<p class="ref">Saisis les critères et les notes pour voir la comparaison.</p>`;
  const T=cmpTot(R),cls=v=>v>0?"p":v<0?"m":"z",sgn=v=>v>0?"+"+v:v<0?"−"+(-v):"0";
  const bar=(n,t)=>{const w=Math.min(50,50*Math.abs(t)/T.max);return `<div class="tot"><b>${n}</b><div class="trk" role="img" aria-label="${n} : total ${sgn(t)} sur ${T.max} possibles"><i style="${t>=0?`left:50%`:`right:50%`};width:${w}%;background:${t>0?"var(--vert)":t<0?"var(--rouge)":"var(--argent)"}"></i></div><b>${sgn(t)}</b></div>`;};
  return `<div class="cmpg"><span class="hd">Critère (poids)</span><span class="hd">MA1</span><span class="hd">MA2</span>${R.map(r=>{const w=parseInt(r.w)||1,v1=w*cmpS(r.s1),v2=w*cmpS(r.s2);return `<span>${esc(r.c)} <span class="tag">×${w}</span></span><span class="v ${cls(v1)}">${sgn(v1)}</span><span class="v ${cls(v2)}">${sgn(v2)}</span>`;}).join("")}</div>
  <h4 style="margin:14px 0 4px">Totaux pondérés <span class="ref">(échelle −${T.max} … +${T.max})</span></h4>${bar("MA1",T.t1)}${bar("MA2",T.t2)}
  <p class="${T.t1===T.t2?"warn":"ok-msg"}" role="status">${T.t1===T.t2?"Égalité : départage sur les avantages et inconvénients décisifs (critère le plus pondéré).":`${T.t1>T.t2?"MA1":"MA2"} l’emporte (${sgn(Math.max(T.t1,T.t2))} contre ${sgn(Math.min(T.t1,T.t2))}). La comparaison éclaire la décision du chef : elle ne la remplace pas.`}</p>`;},
 /* Grille MA × ME */

 rows.forEach((r,ri)=>{const n=r.n.length,step=(W-40)/Math.max(n,7),x0=20+step/2;

/* Répartition au prorata du nombre de questions de chaque étape du groupe */
function exAlloc(pool,n){const tot=pool.reduce((s,m)=>s+m.quiz.length,0);n=Math.min(n,tot);

  used.add(k);if(q.g)seen.add(q.g);qs.push({mid,qi,opt:shuffle(q.o.map((_,i)=>i))});return true;};
 (EX_PLAN[EXS]||EX_PLAN.tout).forEach(([re,n])=>{const pool=M.filter(m=>m.quiz&&m.quiz.length&&re.test(m.grp));let k=0;

 if(EX.res){const R=EX.res,mm=Math.floor(R.dur/60);
  h+=`<div class="score ${R.pct>=PASS*100?"ok":"ko"}" role="status" tabindex="-1">${R.ok} / ${EX.qs.length} – ${R.pct} %${R.expired?" (temps écoulé)":` en ${mm} min`}${R.rec?" – nouveau meilleur résultat":""}</div><p class="ref">Périmètre : ${EX_LBL[EX.sc]||EX_LBL.tout}.</p>`;
  h+=`<div class="card"><h3>Résultat par étape</h3><div class="scores" role="list">${M.filter(z=>R.per[z.id]).map(z=>z.id).map(id=>{const p=R.per[id],v=Math.round(100*p.ok/p.n),m=M.find(z=>z.id===id);return `<div class="sc" role="listitem"><a href="#${id}" onclick="event.preventDefault();go('${id}','c')">${esc(progT(m))}</a><div class="sb" role="img" aria-label="${p.ok} sur ${p.n}"><i style="width:${v}%" class="${v>=PASS*100?"ok":""}"></i><span class="th" style="left:${PASS*100}%"></span></div><b>${p.ok}/${p.n}</b></div>`;}).join("")}</div><p class="ref">Clique sur une étape pour relire sa synthèse.</p></div>`;
  const E=EX.qs.map((x,i)=>[x,i]).filter(([x,i])=>EX.ans[i]!==M.find(z=>z.id===x.mid).quiz[x.qi].a);
  h+=`<div class="card"><h3>${E.length?`Erreurs à revoir (${E.length})`:"Aucune erreur"}</h3>${E.map(([x,i])=>{const m=M.find(z=>z.id===x.mid),q=m.quiz[x.qi],a=EX.ans[i];return `<div class="err"><div class="ref">${esc(m.title)}</div><b>${esc(q.q)}</b><div class="ko">✘ Ta réponse : ${a==null?"<i>sans réponse</i>":esc(q.o[a])}</div><div class="okr">✔ Bonne réponse : ${esc(q.o[q.a])}</div><div class="ex">${esc(q.e)}</div></div>`;}).join("")}</div>`;
  return h+`<div class="rowb"><button class="btn" onclick="exStart()">Nouvel examen</button><button class="btn s" onclick="EX=null;keep()">Fermer</button></div>`;}
 const l=exLeft();
 h+=`<div class="extop${l<=300?" low":""}"><span>Temps restant <b id="exT" role="timer" aria-label="Temps restant">${exFmt(l)}</b></span><span><span id="exC">${Object.keys(EX.ans).length}</span> / ${EX.qs.length} répondues</span></div><div id="exA" class="sr" aria-live="assertive"></div>`;
 h+=EX.qs.map((x,i)=>{const q=M.find(z=>z.id===x.mid).quiz[x.qi],a=EX.ans[i];return `<div class="qz card" id="exq_${i}" role="group" aria-labelledby="exl_${i}"><div class="qq" id="exl_${i}">${i+1}. ${esc(q.q)}</div>${x.opt.map(oi=>`<button class="o ${a===oi?"sel":""}" data-o="${oi}" aria-pressed="${a===oi}" onclick="exAns(${i},${oi})">${esc(q.o[oi])}</button>`).join("")}</div>`;}).join("");
 return h+`<div class="rowb"><button class="btn" onclick="exEnd()">Terminer et corriger</button><button class="btn s" onclick="EX=null;clearInterval(EXtimer);keep()">Abandonner</button></div>`;}

/* ============ FICHE RÉFLEXE ============ */
function fiche(id){const m=M.find(x=>x.id===id);if(!m)return;
 let h=`<div class="fiche"><div class="ref">${esc(m.grp)}${m.ref?" · "+esc(m.ref):""}</div><h2>${esc(m.title)}${m.qtag?` <span class="tag">${esc(m.qtag)}</span>`:""}</h2>`;
 if(m.but)h+=`<h3>But</h3><p>${esc(m.but)}</p>`;
 (m.sections||[]).forEach(s=>{h+=`<h3>${esc(s.h)}</h3>${s.p?`<p>${esc(s.p)}</p>`:""}${s.l?`<ul>${s.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}`;});
 if(m.vig)h+=`<h3>Points de vigilance</h3><ul>${m.vig.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
 if(m.canevas)h+=`<h3>Canevas de la réunion</h3><ol>${m.canevas.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
 h+=`<p class="ref">MEDOT – fiche réflexe</p></div>`;
 openModal(h+`<div class="rowb"><button class="btn" onclick="printFiche()">Imprimer</button><button class="btn s" onclick="copyText(document.querySelector('#modal .fiche').innerText,'ficheMsg')">Copier</button></div><div id="ficheMsg" role="status"></div>`);
 document.body.classList.add("pfiche");}
function printFiche(){const e=document.getElementById("ficheMsg");if(e)e.innerHTML=`<p class="ref">Si la fenêtre d’impression ne s’ouvre pas (version en ligne), utilise « Copier » puis colle dans Word.</p>`;try{window.print();}catch(err){}}
async function copyText(t,where){const out=h=>{const e=document.getElementById(where);if(e)e.innerHTML=h;};
 try{await navigator.clipboard.writeText(t);out(`<p class="ok-msg">Copié : colle-le dans Word ou un message.</p>`);}
 catch(e){out(`<p class="warn">Copie automatique bloquée : sélectionne le texte ci-dessous puis Ctrl+C.</p><textarea aria-label="Texte à copier" style="width:100%;height:30vh">${esc(t)}</textarea>`);}}

/* ============ RECHERCHE ============ */
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function doSearch(v){const out=document.getElementById("sres"),q=norm(v.trim());if(q.length<2){out.innerHTML="";return;}
 const has=s=>norm(s).includes(q)||(LANG!=="fr"&&norm(tr(s)).includes(q)),cut=s=>{s=tr(s);return s.length>90?s.slice(0,88)+"…":s;};
 const mods=M.filter(m=>has(m.title)||has(m.qtag)||has(m.but)).slice(0,8);
 const voc=(M.find(m=>m.id==="vocab")||{cards:[]}).cards.map((c,i)=>[c,i]).filter(([c])=>has(c[0])||has(c[1])).slice(0,8);
 const lex=LEX.map((l,i)=>[l,i]).filter(([l])=>has(l[0])||has(l[1])).slice(0,8);
 const nrm=typeof NORMES==="undefined"?[]:NORMES.flatMap((s,i)=>s.rows.filter(r=>r.some(has)).map(r=>[r,i])).slice(0,8);
 const n=mods.length+voc.length+lex.length+nrm.length;
 out.innerHTML=!n?`<p class="none">Aucun résultat.</p>`:`<span class="sr">${n} résultat${n>1?"s":""}</span>`
  +(mods.length?`<div class="sg">Étapes</div>${mods.map(m=>`<a href="#${m.id}" data-id="${m.id}">${esc(m.title)}${m.but?`<small>${esc(cut(m.but))}</small>`:""}</a>`).join("")}`:"")
  +(voc.length?`<div class="sg">Définitions</div>${voc.map(([c,i])=>`<a href="#vocab" data-id="vocab" data-card="${i}">${esc(c[0])}<small>${esc(cut(c[1]))}</small></a>`).join("")}`:"")
  +(lex.length?`<div class="sg">Sigles</div>${lex.map(([l,i])=>`<a href="#lex" data-id="lex" data-lex="${i}"><b>${esc(l[0])}</b><small>${esc(l[1])}</small></a>`).join("")}`:"")
  +(nrm.length?`<div class="sg">Normes et délais</div>${nrm.map(([r,i])=>`<a href="#normes" data-id="normes" data-norme="${i}">${esc(r[0])}<small>${esc(cut(r.slice(1).filter(x=>x!=="–").join(" · ")))}</small></a>`).join("")}`:"");}

/* ============ CRÉER UN CAS (instructeur) ============ */
/* Fichier de cas au format docs/FORMAT_CAS.md, construit à partir des saisies affichées (les siennes ou l'exemple VIENNE) */
function exportCasForm(){openModal(`<h3>Créer un cas à partir de mes saisies</h3><p>Le fichier reprend, comme corrigé, tout ce qui est rempli dans les onglets « Appliquer »${DEMO_ON?" (ici : l’exemple VIENNE)":""}. Tu pourras ensuite y ajouter un commentaire par étape (rubrique « texte »).</p>
 <div class="fld"><label for="casT">Titre du cas</label><input id="casT" value="Cas d’entraînement" autocomplete="off"></div>
 <div class="fld"><label for="casR">Résumé (une ou deux phrases, affiché dans le bandeau)</label><textarea id="casR" rows="2"></textarea></div>
 <div class="fld"><label for="casS">Situation (texte long ; une ligne vide sépare deux paragraphes)</label><textarea id="casS" rows="6"></textarea></div>
 <div class="rowb"><button class="btn" onclick="exportCas()">Créer le fichier</button></div><div id="casFormMsg" role="status"></div>`);}
function casData(titre,resume,situation){const corrige={},filled=v=>v!=null&&String(v).trim()!=="";
 M.forEach(m=>{if(!m.apply)return;const c={v:{},tab:{}};
  m.apply.forEach(b=>{if(b.t==="fields"&&S.v[b.id]){const o={};b.f.forEach(f=>{if(filled(S.v[b.id][f.k]))o[f.k]=S.v[b.id][f.k];});if(Object.keys(o).length)c.v[b.id]=o;}
   if(b.t==="tiers"&&S.v.tiers&&(S.v.tiers.r||S.v.tiers.c))c.v.tiers=S.v.tiers;
   const t=blkTab(b);if(t&&S.tab[t.id]){const rows=S.tab[t.id].filter(r=>t.cols.some(cl=>!cl.ro&&filled(r[cl.k])));if(rows.length)c.tab[t.id]=rows;}});
  const tc=S.tcidr.filter(r=>r.src===m.id&&filled(r.l)).map(({y,fo,l})=>({y,fo,l}));if(tc.length)c.tcidr=tc;
  const fr=S.frise.filter(r=>r.src===m.id&&(filled(r.g)||filled(r.e))).map(({g,e})=>({g,e}));if(fr.length)c.frise=fr;
  if(!Object.keys(c.v).length)delete c.v;if(!Object.keys(c.tab).length)delete c.tab;
  if(Object.keys(c).length)corrige[m.id]=c;});
 return {titre,resume,situation,corrige};}
function exportCas(){const g=id=>(document.getElementById(id)||{}).value||"",titre=g("casT").trim(),out=document.getElementById("casFormMsg");
 if(!titre){if(out)out.innerHTML=`<p class="warn">Donne un titre au cas.</p>`;return;}
 const d=casData(titre,g("casR").trim(),g("casS").trim()),n=Object.keys(d.corrige).length;
 if(!n){if(out)out.innerHTML=`<p class="warn">Aucune saisie à reprendre : remplis d’abord les gabarits (onglets « Appliquer »).</p>`;return;}
 closeModal();dl("cas_"+titre.replace(/[^\wÀ-ÿ]+/g,"_").replace(/^_+|_+$/g,"")+".json","application/json",JSON.stringify(d,null,1));
 const e=document.getElementById("casMsg");if(e)e.innerHTML=`<p class="ok-msg">Cas « ${esc(titre)} » : corrigé pour ${n} étape(s). Complète au besoin la situation et les commentaires (« texte ») dans le fichier, puis charge-le avec « Charger un cas ».</p>`;}

/* ============ FOCUS, HAUTEUR DES CHAMPS, SOMMAIRE (audit forme v2) ============ */
let FOCUS_NEXT=null;
function focusKey(el){const m=document.getElementById("main");if(!el||el===m||!m.contains(el))return null;
 if(el.id)return "#"+CSS.escape(el.id);
 for(const a of ["aria-label","onclick","onchange","oninput"]){const v=el.getAttribute(a);if(v)return `${el.tagName}[${a}="${CSS.escape(v)}"]`;}
 return null;}
function autoH(list){const L=[...list].filter(t=>t.offsetParent!==null);L.forEach(t=>t.style.height="0px");
 const h=L.map(t=>t.scrollHeight);L.forEach((t,i)=>t.style.height=(h[i]+2)+"px");}
function applyToc(){if(curTab!=="a")return;const el=document.getElementById("main");if(!el.querySelector(".tabs"))return;
 const hs=[...el.querySelectorAll(".card>h3,details.card>summary b")];if(hs.length<4)return;
 const n=document.createElement("div");n.className="toc";n.setAttribute("role","navigation");n.setAttribute("aria-label","Sommaire de l’onglet");
 n.innerHTML=hs.map((h,i)=>{const t=h.closest(".card");t.id="sec_"+i;h.tabIndex=-1;h.id="sech_"+i;return `<a href="#sec_${i}" onclick="event.preventDefault();const c=document.getElementById('sec_${i}'),h=document.getElementById('sech_${i}');if(c.tagName==='DETAILS')c.open=true;c.scrollIntoView();h.focus({preventScroll:true})">${esc(h.textContent.replace(/^Gantt – /,"Gantt : "))}</a>`;}).join("");
 el.querySelector(".tabs").after(n);}
const _render=render;
render=function(){const k=focusKey(document.activeElement);_render();
 autoH(document.querySelectorAll("#main textarea"));
 applyToc();
 let e=null;try{e=k&&document.querySelector(k);}catch(x){e=null;}if(e&&e.disabled)e=null;
 if(!e&&FOCUS_NEXT){e=document.querySelector(FOCUS_NEXT);if(e&&!e.matches("a,button,input,select,textarea,summary,[tabindex]"))e.tabIndex=-1;}
 FOCUS_NEXT=null;if(e)e.focus({preventScroll:true});};
document.addEventListener("input",e=>{if(e.target.matches("#main textarea"))autoH([e.target]);});
document.addEventListener("toggle",e=>{if(e.target.open)autoH(e.target.querySelectorAll("textarea"));},true);
let rsz;addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{refreshCharts();autoH(document.querySelectorAll("#main textarea"));},200);});
const toTop=document.getElementById("toTop");addEventListener("scroll",()=>{toTop.hidden=scrollY<1200;},{passive:true});

/* ============ INIT ============ */
document.addEventListener("click",e=>{if(document.body.classList.contains("navopen")&&!document.getElementById("nav").contains(e.target)&&e.target.id!=="menuBtn")toggleNav(false);});
USER=S;const dsw=document.getElementById("demoSw");dsw.onchange=()=>setDemo(dsw.checked);
function setDemo(on){DEMO_ON=on;dsw.checked=on;const b=document.getElementById("demoBanner");
 if(on){USER=S;S=JSON.parse(JSON.stringify(DEMO));S.quiz=USER.quiz;b.hidden=false;b.innerHTML=`<details><summary><b>Exemple VIENNE – ${esc(DEMO_SITU.titre)}</b> (lire la situation)</summary>${esc(DEMO_SITU.situation||DEMO_SITU.resume).split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("")}</details><i>Modifications non enregistrées.</i> <button class="btn s" onclick="setDemo(false)">Revenir à mes travaux</button>`;}
 else{S=USER;b.hidden=true;}
 QZ={};render();}
function toggleNav(f){const n=document.getElementById("nav"),o=f===undefined?!n.classList.contains("open"):f;n.classList.toggle("open",o);document.body.classList.toggle("navopen",o);document.getElementById("menuBtn").setAttribute("aria-expanded",o);if(o)setTimeout(()=>document.getElementById("navX").focus(),60);}
function fromHash(){const h=(location.hash||"").slice(1);const m=M.find(x=>x.id===h);if(m&&unlocked(m)){cur=h;curTab="c";}render();}
window.addEventListener("hashchange",fromHash);renderCas();fromHash();
</script>
